/* ---------- Carátulas reales (caja con el logotipo rojo de Switch) ---------- */
function switchBoxScore(img){
  const w=105,h=170;const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d",{willReadFrequently:true});g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const frac=(x0,y0,x1,y1,fn)=>{let n=0,t=0;for(let y=Math.round(y0*h);y<Math.round(y1*h);y++)for(let x=Math.round(x0*w);x<Math.round(x1*w);x++){const i=(y*w+x)*4;t++;if(fn(d[i],d[i+1],d[i+2]))n++}return t?n/t:0};
  const red=(r,g,b)=>r>150&&g<90&&b<100&&r-g>90;
  const white=(r,g,b)=>r>200&&g>200&&b>200;
  // recuadro rojo con logotipo blanco arriba a la izquierda
  const tl=frac(0.02,0.01,0.2,0.1,red),tlw=frac(0.02,0.01,0.2,0.1,white);
  const rest=frac(0.35,0.3,0.95,0.9,red);
  const le=frac(0,0.2,0.035,0.95,red),re=frac(0.965,0.2,1,0.95,red),te=frac(0.25,0,0.95,0.02,red),be=frac(0.1,0.975,0.9,1,red),wl=frac(0.03,0.02,0.2,0.1,(r,g,b)=>r>170&&g>170&&b>170);
  const sw1=tl>=0.35&&tlw>=0.02&&rest<0.6,sw2=tl>=0.8&&Math.max(le,re)>=0.8&&te>=0.6&&be>=0.4&&rest<0.3;
  return {tl,tlw,rest,le,re,te,be,ok:sw1||sw2};
}

const BOXF={running:false,checked:0,total:0,found:0};
async function blobToImg(b){const u=URL.createObjectURL(b);try{return await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=u})}finally{setTimeout(()=>URL.revokeObjectURL(u),2000)}}
async function fetchBlob(url,ms=20000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)return null;const b=await r.blob();return b.type.startsWith("image/")?b:null}catch{return null}finally{clearTimeout(t)}}
async function isBoxBlob(b){try{return switchBoxScore(await blobToImg(b)).ok}catch{return false}}
async function boxCandidates(r){
  const arts=new Map();for(const [l,t] of Object.entries(r.lk||{}))arts.set(l+"|"+t,[l,t]);
  for(const lang of ["en","ja","fr","es","de","it"]){if([...arts.values()].some(([l])=>l===lang))continue;const nm=r.en||r.n;
    try{const j=await wpJ(lang,"action=query&list=search&srlimit=3&srsearch="+encodeURIComponent(`"${nm}" Switch`),15000);
      for(const h of j.query?.search||[])if(simTitle(h.title,nm)){arts.set(lang+"|"+h.title,[lang,h.title]);break}}catch{}}
  const cands=[];
  for(const [lang,title] of arts.values()){if(cands.length>=14)break;
    try{const j=await wpJ(lang,"action=query&redirects=1&prop=pageimages|images&piprop=thumbnail&pithumbsize=330&pilicense=any&imlimit=30&titles="+encodeURIComponent(title),15000);
      const pg=Object.values(j.query?.pages||{})[0];if(!pg)continue;if(pg.thumbnail)cands.push(pg.thumbnail.source);
      const files=(pg.images||[]).map(x=>x.title).filter(f=>/\.(jpe?g|png|webp)$/i.test(f)&&!/logo|icon|screenshot|captura|map|flag|signature/i.test(f)).slice(0,10);
      if(files.length){const k=await wpJ(lang,"action=query&prop=imageinfo&iiprop=url&iiurlwidth=330&titles="+encodeURIComponent(files.join("|")),15000);
        for(const p of Object.values(k.query?.pages||{})){const u=p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url;if(u)cands.push(u)}}}catch{}}
  return [...new Set(cands)].filter(u=>u!==r.img);
}
async function checkOneBox(r){
  // ¿la carátula actual ya es la caja real?
  let cur=null;if(r.imgSaved&&S.idb)cur=await idbGet("refimg/"+r.q);if(!cur&&r.img)cur=await fetchBlob(r.img);
  if(cur&&await isBoxBlob(cur)){r.box=1;return}
  for(const u of await boxCandidates(r)){const b=await fetchBlob(u);if(!b)continue;
    if(await isBoxBlob(b)){if(S.idb)await idbOp("put","refprop/"+r.q,b);REF.props=REF.props.filter(p=>p.q!==r.q);REF.props.push({q:r.q,url:u});BOXF.found++;r.boxTry=Date.now();return}}
  r.boxTry=Date.now();
}
async function boxFixer(){
  if(BOXF.running||!REF.list.length||navigator.onLine===false)return;BOXF.running=true;
  const MONTH=30*864e5;const pendingQ=new Set(REF.props.map(p=>p.q));
  const todo=REF.list.filter(r=>fmtOf(r)==="fisico"&&!r.box&&!pendingQ.has(r.q)&&(!r.boxTry||Date.now()-r.boxTry>MONTH));
  BOXF.total=REF.list.filter(r=>fmtOf(r)==="fisico").length;BOXF.checked=BOXF.total-todo.length;BOXF.found=REF.props.length;
  try{for(const r of todo){while(HUNT.running||REF.building)await new Promise(ok=>setTimeout(ok,5000));try{await checkOneBox(r)}catch{}BOXF.checked++;boxStatus();if(BOXF.checked%20===0)saveRefSoon();await new Promise(ok=>setTimeout(ok,400))}}
  finally{BOXF.running=false;await saveRef();boxStatus();if(S.route==="catalogo")render()}
}

function buildPcIndex(list,date){
  const byId=new Map(),byKey=new Map(),byUpc=new Map(),byConsole=new Map();
  for(const p of list){byId.set(p.id,p);byKey.set(norm(p.console)+"|"+norm(p.name),p);
    if(p.upc)for(const u of p.upc.split(/\D+/))if(u.length>=8){byUpc.set(u,p);byUpc.set(u.replace(/^0+/,""),p)}
    const k=norm(p.console);if(!byConsole.has(k))byConsole.set(k,[]);byConsole.get(k).push(p)}
  S.pcIndex={byId,byKey,byUpc,byConsole,date};
  refreshNames();if(false){const names=[...new Set(list.map(p=>p.name))].sort().slice(0,25000);dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("")}
}
function platFromConsole(c){const base=String(c||"").replace(/^(PAL|JP)\s+/i,"");const id=Object.keys(PC_CONSOLE).find(k=>norm(PC_CONSOLE[k])===norm(base));return id||""}
function regionFromConsole(c){return /^PAL/i.test(c)?"PAL-EU":/^JP/i.test(c)?"NTSC-J":"NTSC-U"}
function pcConsoleFor(t){const base=PC_CONSOLE[t.platform];if(!base)return[];const r=String(t.region||"");return r.startsWith("PAL")?["PAL "+base,base]:r==="NTSC-J"?["JP "+base,base]:[base,"PAL "+base]}
async function importPC(file){
  const out=$("#pcOut");if(!out)return;
  if(!num(S.settings.usdEur)){out.innerHTML=`<p class="small" style="color:var(--bad)">Indica primero el cambio USD→EUR.</p>`;return}
  out.innerHTML=`<p class="small muted">Leyendo archivo…</p>`;
  const rows=parseCSV(await file.text());const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  const ix=k=>head.indexOf(k);const iId=ix("id"),iC=ix("console-name"),iN=ix("product-name"),iL=ix("loose-price"),iCib=ix("cib-price"),iNew=ix("new-price"),iU=ix("upc"),iD=ix("release-date");
  if(iC<0||iN<0||(iL<0&&iCib<0)){out.innerHTML=`<p class="small" style="color:var(--bad)">No reconozco el formato: faltan columnas como product-name, console-name o cib-price.</p>`;return}
  const wanted=new Set(Object.values(PC_CONSOLE).flatMap(c=>[c,"PAL "+c,"JP "+c].map(norm)));
  const list=[];
  for(const r of rows){const c=r[iC];if(!c||!wanted.has(norm(c)))continue;
    list.push({id:r[iId],console:c,name:r[iN],loose:usd(r[iL]),cib:usd(r[iCib]),new:usd(r[iNew]),upc:iU>=0?String(r[iU]||"").replace(/[^\d,; ]/g,""):""})}
  const date=today();buildPcIndex(list,date);if(S.idb)idbOp("put","pcrows",{date,list});
  const {byId,byKey,byUpc}=S.pcIndex;let upd=0;const unmatched=[];
  for(const t of S.titles.values()){
    if(t.ejemplo)continue;
    let p=t.guide?.pcId&&byId.get(t.guide.pcId);
    if(!p&&t.ean)p=byUpc.get(t.ean)||byUpc.get(t.ean.replace(/^0+/,""));
    if(!p)for(const c of pcConsoleFor(t)){p=byKey.get(norm(c)+"|"+norm(t.name));if(p)break}
    if(p){applyGuide(t,p,date);upd++}else unmatched.push(t);
  }
  S.pcUnmatched=unmatched.map(t=>t.id);
  S.pcMsg=`<p class="small" style="color:var(--good)">Actualizados ${upd} títulos con la guía del ${fdate(date)}. ${unmatched.length?`${unmatched.length} sin coincidencia exacta: revísalos abajo.`:""}</p>`;
  render();
}
function applyGuide(t,p,date){
  const g={src:"PriceCharting",pcId:p.id,pcName:p.name,console:p.console,cur:"USD",date,loose:p.loose,cib:p.cib,new:p.new};
  const gh=[...(t.gh||[])];const last=gh.at(-1);
  const pt=[date,p.loose,p.cib,p.new];
  if(last&&last[0]===date)gh[gh.length-1]=pt;else if(!last||last[1]!==p.loose||last[2]!==p.cib||last[3]!==p.new||(new Date(date)-new Date(last[0]))>=7*864e5)gh.push(pt);
  saveTitle({...t,guide:g,gh:gh.slice(-260)});
}
function pcCandidates(t){
  const idx=S.pcIndex;if(!idx)return[];const words=norm(t.name).split(" ").filter(w=>w.length>1);if(!words.length)return[];
  const out=[];for(const c of pcConsoleFor(t))for(const p of idx.byConsole.get(norm(c))||[]){const n=" "+norm(p.name)+" ";const hit=words.filter(w=>n.includes(" "+w+" ")).length;if(hit)out.push({p,score:hit/Math.max(words.length,n.trim().split(" ").length)})}
  return out.sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.p);
}

        changed++}

}

async function lookupEAN(code){

  if(cache[code])return cache[code];
  try{
    const r=await fetch("https://api.upcitemdb.com/prod/trial/lookup?upc="+encodeURIComponent(code),{headers:{Accept:"application/json"}});
    if(r.status===429)return{error:"Límite diario de búsquedas gratuitas alcanzado (100 al día)."};

    try{cache[code]=out;localStorage.setItem("gv-ean",JSON.stringify(cache))}catch{}
    return out;
  }catch{return{error:"Las bases de datos de códigos no dejan consultarse desde un archivo, o no tienen este juego."}}
}

    const base={id:uid(),region:"Desconocida",edition:"",origin:code?"Código de barras":"Foto",createdAt:new Date().toISOString()};
    if(code){found++;
      const ean=code.length===12?"0"+code:code;
      const own=[...S.titles.values()].find(t=>t.ean&&(t.ean===code||t.ean===ean||t.ean.replace(/^0+/,"")===code.replace(/^0+/,"")));
      const p=!own&&S.pcIndex?(S.pcIndex.byUpc.get(code)||S.pcIndex.byUpc.get(code.replace(/^0+/,""))):null;
      if(own)saveReview({...base,name:own.name,platform:own.platform,edition:own.edition||"",region:own.region||"Desconocida",ean:own.ean,matchId:own.id,conf:.95,note:"Ya está en tu colección: se añadirá otra copia"});
      else if(p)saveReview({...base,name:p.name,platform:platFromConsole(p.console),region:regionFromConsole(p.console),ean:code,pcId:p.id,conf:.9,note:"Identificado por código de barras ("+p.console+")",...thumb});
      else{
        if(st)st.textContent=`Buscando el código ${code} en internet…`;
        const w=await lookupEAN(code);
        if(w&&w.title){const pl=guessPlatform(w.title+" "+(w.category||""));
          saveReview({...base,name:cleanTitle(w.title),platform:pl,ean:code,publisher:w.brand||"",coverUrl:w.image||"",webSrc:"UPCitemdb",conf:pl?.8:.5,note:"Encontrado en internet: «"+w.title.slice(0,90)+"»"+(pl?"":". Elige la consola."),...thumb});webFound++}
        else saveReview({...base,name:"",platform:"",ean:code,conf:.3,note:(w&&w.error?w.error+" ":"No aparece en internet. ")+"Escribe título y consola; la próxima copia con este código se reconocerá sola.",...thumb});
      }
    }else{covers++;saveReview({...base,name:"",platform:"",ean:"",conf:.3,note:"Portada recortada automáticamente. Escribe el título y la consola.",...thumb,...photo,autocrop:3});lastCover=base.id}
  }
  const msg=`${files.length} ${files.length===1?"foto":"fotos"}: ${found} códigos leídos${webFound?`, ${webFound} encontrados en internet`:""}${covers?`, ${covers} sin código`:""}.${libFail?" No se pudo cargar el lector de códigos (¿sin internet?).":""}`;
  if(st)st.textContent=msg;toast(msg+" Revísalos en la bandeja.");
}
function bulkAdd(txt){
  let n=0;
  for(const line of txt.split(/\r?\n/)){const p=line.split(/[;\t]/).map(s=>s.trim());if(!p[0])continue;
    const pq=norm(p[1]||"");const pl=S.settings.platforms.find(x=>norm(x.id)===pq||norm(x.short)===pq||norm(x.name)===pq);
    saveReview({id:uid(),name:p[0],platform:pl?.id||"",edition:p[2]||"",region:REGIONS.includes(p[3])?p[3]:"Desconocida",ean:(p[4]||"").replace(/\D/g,""),conf:pl?0.8:0.5,origin:"Texto",note:pl?"":"Consola no reconocida",createdAt:new Date().toISOString()});n++}
  toast(`${n} líneas añadidas a la bandeja.`);
}
function confirmReview(id){
  const r=S.review.get(id);if(!r)return false;
  if(!r.name||!r.platform){toast("Falta título o consola.");return false}
  const ms=matches(r);const target=r.matchId&&r.matchId!=="new"?r.matchId:(r.matchId==="new"?null:ms.find(t=>norm(t.name)===norm(r.name)&&(t.edition||"")===(r.edition||""))?.id);
  let tid=target;
  const rf=(r.platform==="switch"||!r.platform)?refFind(r.name):null;
  if(!tid){tid=uid();saveTitle({wd:rf?.q,year:rf?.y||"",genre:rf?.g||"",developer:rf?.d||"",...(rf&&!r.thumbId&&!r.thumbData&&!r.coverUrl&&rf.img?{coverUrl:rf.img}:{}),id:tid,name:r.name,platform:r.platform,edition:r.edition||"",region:r.region,ean:r.ean||"",source:"Reconocimiento ("+(r.origin||"foto")+"), confirmado",publisher:r.publisher||rf?.p||"",coverUrl:r.coverUrl||(rf&&!r.thumbId&&!r.thumbData?rf.img||"":""),coverId:r.coverUrl?undefined:r.thumbId,coverData:r.coverUrl?undefined:r.thumbData,coverSource:r.coverUrl?"Internet ("+(r.webSrc||"")+")":r.thumbId||r.thumbData?"Tu foto":"",autocrop:r.autocrop||0,coverOrig:r.photoData||r.thumbData||"",createdAt:new Date().toISOString()})}
  else{const t=S.titles.get(tid);if(t&&!coverSrc(t)&&(r.thumbId||r.thumbData))saveTitle({...t,coverId:r.thumbId,coverData:r.thumbData,coverSource:"Recorte de tu foto"});}
  saveCopy({id:uid(),titleId:tid,status:"coleccion",cond:"Desconocido",box:true,media:true,region:r.region,createdAt:new Date().toISOString()});
  const nt=S.titles.get(tid);
  if(nt&&!nt.guide&&S.pcIndex&&num(S.settings.usdEur)){let p=(r.pcId&&S.pcIndex.byId.get(r.pcId))||(nt.ean&&S.pcIndex.byUpc.get(nt.ean));
    if(!p)for(const c of pcConsoleFor(nt)){p=S.pcIndex.byKey.get(norm(c)+"|"+norm(nt.name));if(p)break}
    if(p)applyGuide(nt,p,S.pcIndex.date)}
  write(COL.review,id,null);S.sel?.delete(id);return true;
}

/* ---------- Exportación ---------- */
async function offerFile(filename,data){
  if(!window.AndroidBridge&&$("#restoreOut")){const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"}));const mb=(data.length/1048576).toFixed(1);
    $("#restoreOut").innerHTML=`<div class="banner" style="margin-top:10px"><p style="margin:0 0 8px"><b>Copia lista</b> (${mb} MB). Pulsa el botón para guardarla en Descargas:</p><a class="btn primary" href="${u}" download="${esc(filename)}">Guardar ${esc(filename)}</a></div>`;
    $("#restoreOut").scrollIntoView({block:"center"});toast("Copia lista: pulsa «Guardar»",5000);return}
  if(S.dl){try{await S.dl.save({filename,data});return}catch(e){if(e?.code==="declined"||e?.code==="cancelled")return}}
  $("#restoreOut").innerHTML=`<p class="small muted">No se pudo descargar directamente. Copia el contenido:</p><textarea class="inp mono" rows="6" readonly>${esc(data)}</textarea>`;
}
function backupJSON(){const o={app:"GameVault",version:1,exportedAt:new Date().toISOString(),settings:S.settings};for(const k of Object.keys(COL))o[k]=[...S[k].values()];return JSON.stringify(o)}
async function backupFull(){const out=$("#restoreOut");const o=JSON.parse(backupJSON());o.version=2;o.refcat={date:REF.date,list:REF.list,deleted:[...REF.deleted],deletedNames:[...REF.deletedNames]};o.boxes={};
  if(S.idb){const todo=REF.list.filter(r=>r.box&&r.imgSaved);let i=0;for(const r of todo){i++;if(out&&i%10===1)out.innerHTML=`<p class="small muted">Preparando la copia… cajas ${i} de ${todo.length}</p>`;const b=await idbGet("refimg/"+r.q);if(b)o.boxes[r.q]=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>ok("");fr.readAsDataURL(b)})}}
  return JSON.stringify(o)}
function copiesCSV(){
  const H=["id_copia","titulo","consola","edicion","region","ean","situacion","conservacion","precintado","caja","manual","juego","coste","gastos","fecha_compra","ubicacion","canal_venta","precio_venta","comisiones","envio","embalaje","fecha_venta","beneficio_neto","valor_estimado"];
  const q=v=>{v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[...S.copies.values()].map(c=>{const t=S.titles.get(c.titleId)||{},s=c.sale||{},m=market(c.titleId);
    return [c.id,t.name,plat(t.platform).name,t.edition,c.region,t.ean,STATUS[c.status]?.[0],c.cond,c.sealed?"sí":"no",c.box?"sí":"no",c.manual?"sí":"no",c.media?"sí":"no",c.cost,c.extra,c.purchaseDate,c.location,s.channel,s.price,s.fees,s.ship,s.pack,s.date,c.status==="vendido"?saleNet(c).toFixed(2):"",m?m.value.toFixed(2):""].map(q).join(";")});
  return "﻿"+[H.join(";"),...rows].join("\n");
}
async function restore(file){
  const out=$("#restoreOut");let o;try{o=JSON.parse(await file.text())}catch{out.innerHTML=`<p class="small" style="color:var(--bad)">El archivo no es una copia de GameVault válida.</p>`;return}
  if(o?.app!=="GameVault"){out.innerHTML=`<p class="small" style="color:var(--bad)">El archivo no es una copia de GameVault.</p>`;return}
  if(o.refcat&&Array.isArray(o.refcat.list)){const have=new Set(REF.list.map(r=>r.q));const add=o.refcat.list.filter(r=>r&&r.q&&!have.has(r.q));const byQ=new Map(o.refcat.list.map(r=>[r.q,r]));
    for(const r of REF.list){const x=byQ.get(r.q);if(x){for(const k of ["box","phys","fmt","img"])if(x[k]!==undefined&&r[k]===undefined)r[k]=x[k];if(x.box)r.box=1}}
    for(const q of o.refcat.deleted||[])REF.deleted.add(q);for(const nn of o.refcat.deletedNames||[])REF.deletedNames.add(nn);
    setRef([...REF.list,...add],REF.date||o.refcat.date);
    let nb=0;if(S.idb&&o.boxes)for(const [q,du] of Object.entries(o.boxes)){try{const b=await (await fetch(du)).blob();await idbOp("put","refimg/"+q,b);const r=REF.byQ.get(q);if(r){r.imgSaved=1;r.box=1;r.trim3=1}nb++}catch{}}
    await saveRef();toast(`Catálogo restaurado: ${add.length.toLocaleString("es-ES")} juegos y ${nb} cajas`)}
  const plan={};let n=0;for(const k of Object.keys(COL)){plan[k]=(o[k]||[]).filter(d=>d&&typeof d.id==="string"&&!S[k].has(d.id));n+=plan[k].length}
  out.innerHTML=`<div class="banner row between" style="margin-top:10px"><span>Se añadirán ${plan.titles.length} títulos, ${plan.copies.length} copias, ${plan.prices.length} precios y ${plan.review.length} revisiones. Los registros existentes no cambian.</span>${n?`<button class="btn primary" id="doRestore">Restaurar</button>`:""}</div>`;
  const b=$("#doRestore");if(b)b.onclick=async()=>{b.disabled=true;let i=0;for(const k of Object.keys(COL))for(const d of plan[k]){await write(COL[k],d.id,d);if(++i%20===0)b.textContent=`${i}/${n}…`}out.innerHTML=`<p class="small" style="color:var(--good)">Restauración completada: ${n} registros añadidos.</p>`};
}

/* ---------- Vinculación de la vista ---------- */
function bindView(){
  const v=$("#view");
  v.onclick=e=>{
    const ro=e.target.closest("[data-refopen]");if(ro){openRefSheet(ro.dataset.refopen);return}
    const ra=e.target.closest("[data-refadd]");if(ra){addFromRef(ra.dataset.refadd);return}
    const po=e.target.closest("[data-propok]");if(po){approveProp(po.dataset.propok).then(()=>{saveRef();toast("Carátula sustituida");render()});return}
    const pn=e.target.closest("[data-propno]");if(pn){discardProp(pn.dataset.propno);saveRef();render();return}
    const rt=e.target.closest("[data-reftab]");if(rt){REF.tab=rt.dataset.reftab;render();return}
    const rp=e.target.closest("[data-refphys]");if(rp){const r=REF.list.find(x=>x.q===rp.dataset.refphys);if(r){r.phys=true;saveRef();toast(r.n+": marcado como físico");render()}return}
    const rg=e.target.closest("[data-refdig]");if(rg){const r=REF.list.find(x=>x.q===rg.dataset.refdig);if(r){r.phys=false;saveRef();toast(r.n+": enviado a revisión (solo digital)");render()}return}
    const rd=e.target.closest("[data-refdel]");if(rd){const r=REF.list.find(x=>x.q===rd.dataset.refdel);deleteRef([rd.dataset.refdel]);toast((r?.n||"Juego")+" borrado del catálogo");render();return}
    const t=e.target.closest("[data-title]");if(t){openTitle(t.dataset.title,t.dataset.tab||"ficha");return}
    const cp=e.target.closest("[data-copy]");if(cp){sheetState=null;openCopy(cp.dataset.copy);return}
    const g=e.target.closest("[data-go]");if(g){if(g.dataset.missing){S.f.missing=g.dataset.missing;S.f.plat="all"}location.hash=g.dataset.go;return}
    const pl=e.target.closest("[data-plat]");if(pl){S.f.plat=pl.dataset.plat;render();return}
    const ly=e.target.closest("[data-layout]");if(ly){S.f.layout=ly.dataset.layout;render();return}
    const dp=e.target.closest("[data-delprice]");if(dp){write(COL.prices,dp.dataset.delprice,null);return}
    const rv=e.target.closest("[data-rv]");if(rv){const id=rv.closest("[data-rev]").dataset.rev;const k=rv.dataset.rv;
      if(k==="crop"){cropReview(id);return}
      if(k==="ok"){if(confirmReview(id))toast("Añadido a la colección")}
      else if(k==="no"){write(COL.review,id,null);toast("Identificación rechazada")}
      else{const r=S.review.get(id);saveReview({...r,createdAt:new Date().toISOString()});toast("Se queda pendiente al final de la bandeja")}return}
    const dc=e.target.closest("[data-delch]");if(dc){S.settings.channels.splice(+dc.dataset.delch,1);saveSettings();return}
    const a=e.target.closest("[data-act]")?.dataset.act;if(!a)return;
    if(a==="newTitle"){sheetState={type:"title",id:null,tab:"ficha"};drawSheet()}
    else if(a==="more"){S.limit=(S.limit||240)+240;render()}
    else if(a==="clearMissing"){S.f.missing=false;render()}
    else if(a==="newPrice"){if(!S.titles.size){toast("Primero cataloga algún título.");return}sheetState=null;openPrice([...S.titles.keys()][0])}
    else if(a==="bulk"){const x=$("#bulkTxt").value;if(x.trim()){bulkAdd(x);$("#bulkTxt").value=""}}
    else if(a==="selReady"){S.sel=new Set([...S.review.values()].filter(reviewReady).map(r=>r.id));render()}
    else if(a==="confirmSel"){const ids=[...(S.sel||[])].filter(id=>S.review.has(id)&&reviewReady(S.review.get(id)));if(!ids.length){toast("No hay elementos seleccionados.");return}let n=0;for(const id of ids)if(confirmReview(id))n++;toast(`${n} juegos añadidos a la colección`)}
    else if(a==="clearEx"){for(const t of [...S.titles.values()].filter(t=>t.ejemplo)){for(const c of copiesOf(t.id))write(COL.copies,c.id,null);for(const p of pricesOf(t.id))write(COL.prices,p.id,null);write(COL.titles,t.id,null)}toast("Ejemplos eliminados")}
    else if(a==="saveMargin"){const m=num($("#sMargin").value);if(m==null||m<0){toast("Introduce un margen válido.");return}S.settings.margin=m;saveSettings();toast("Margen guardado")}
    else if(a==="addCh"){S.settings.channels.push({name:"Nuevo canal",pct:0,fixed:0,ship:0,pack:0});saveSettings()}
    else if(a==="saveCh"){v.querySelectorAll("[data-ch]").forEach(i=>{const c=S.settings.channels[+i.dataset.ch];if(!c)return;c[i.dataset.k]=i.dataset.k==="name"?i.value.trim()||c.name:(num(i.value)??0)});S.settings.feesChecked=true;saveSettings();toast("Comisiones guardadas")}
    else if(a==="addPlat"){const name=$("#npName").value.trim(),short=$("#npShort").value.trim().toUpperCase();if(!name||!short){toast("Indica nombre y abreviatura.");return}const id=norm(short).replace(/ /g,"")||uid();if(S.settings.platforms.some(p=>p.id===id)){toast("Esa consola ya existe.");return}S.settings.platforms=[...S.settings.platforms,{id,name,short,color:$("#npColor").value}];saveSettings();toast("Consola añadida")}
    else if(a==="saveFx"){const r=num($("#fx").value);if(r==null||r<=0||r>5){toast("Introduce un cambio válido, por ejemplo 0,86.");return}S.settings.usdEur=r;S.settings.usdEurDate=today();saveSettings();toast("Cambio guardado")}
    else if(a==="nextPending"){const t=[...S.titles.values()].filter(t=>!t.ejemplo&&!market(t.id)).sort((a,b)=>a.name.localeCompare(b.name,"es"))[0];if(t){sheetState={type:"title",id:t.id,tab:"precios"};openCapture(t.id)}}
    else if(a==="saveKey"){try{localStorage.setItem("gv-key",$("#apiKey").value.trim());localStorage.setItem("gv-model",$("#apiModel").value.trim()||"claude-sonnet-5-5")}catch{toast("Este navegador no permite guardar la clave.");return}toast("Clave guardada");render()}
    else if(a==="recropAll"){migrateCrops(true)}
    else if(a==="refDelAsk"){const n=REF.list.filter(r=>fmtOf(r)==="digital").length;$("#refDelConfirm").innerHTML=`<span class="small">Se borrarán ${n.toLocaleString("es-ES")} juegos del catálogo (no de tu colección) y no se volverán a descargar.</span> <button class="btn danger" data-act="refDelYes">Sí, borrar</button>`}
    else if(a==="refDelYes"){const qs=REF.list.filter(r=>fmtOf(r)==="digital").map(r=>r.q);deleteRef(qs);toast(qs.length.toLocaleString("es-ES")+" juegos solo digitales borrados del catálogo");render()}
    else if(a==="propAll"){(async()=>{const qs=REF.props.map(p=>p.q);for(const q of qs)await approveProp(q);await saveRef();toast(qs.length.toLocaleString("es-ES")+" carátulas sustituidas");render()})()}
    else if(a==="propNone"){for(const p of [...REF.props])discardProp(p.q);saveRef();render()}
    else if(a==="buildRef")syncCatalog(true).then(()=>coverHunter());
    else if(a==="diag")diagnose();
    else if(a==="refMore"){REF.limit+=120;render()}
    else if(a==="backup"){toast("Preparando la copia completa…");backupFull().then(d=>offerFile(`gamevault-copia-${today()}.json`,d))}
    else if(a==="csv")offerFile(`gamevault-copias-${today()}.csv`,copiesCSV());
  };
  v.onchange=e=>{
    const el=e.target;
    if(el.id==="fStatus"){S.f.status=el.value;render()}
    else if(el.id==="fSort"){S.f.sort=el.value;render()}
    else if(el.id==="photoIn"){const fs=[...el.files];el.value="";if(fs.length)analyze(fs)}
    else if(el.id==="camIn"){const fs=[...el.files];el.value="";if(fs.length)addPhotos(fs)}
    else if(el.id==="localIn"){const fs=[...el.files];el.value="";if(fs.length)addPhotos(fs)}
    else if(el.dataset&&el.dataset.refbox){const f=el.files[0];const q=el.dataset.refbox;el.value="";if(f)setRefBox(q,f)}
    else if(el.id==="refCover"){REF.onlyCover=el.checked;REF.limit=120;render()}
    else if(el.id==="restoreIn"){const f=el.files[0];if(f)restore(f)}
    else if(el.id==="pcIn"){const f=el.files[0];if(f)importPC(f).catch(()=>{$("#pcOut").innerHTML=`<p class="small" style="color:var(--bad)">No se pudo leer el archivo.</p>`})}
    else if(el.dataset.pcmatch){const t=S.titles.get(el.dataset.pcmatch),p=S.pcIndex?.byId.get(el.value);if(t&&p){applyGuide(t,p,S.pcIndex.date);toast("Guía asignada a "+t.name)}}
    else if(el.dataset.sel){S.sel??=new Set();el.checked?S.sel.add(el.dataset.sel):S.sel.delete(el.dataset.sel)}
    else if(el.dataset.rf){const id=el.closest("[data-rev]").dataset.rev;const r=S.review.get(id);if(!r)return;const k=el.dataset.rf;const val=k==="ean"?el.value.replace(/\D/g,""):el.value;
      const upd={...r,[k]:val};if(k!=="matchId"&&k!=="region")upd.conf=Math.max(r.conf||0,0.9);if(k==="matchId")upd.conf=Math.max(r.conf||0,0.9);saveReview(upd)}
  };
  const d=$("#drop");if(d){d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");d.ondrop=e=>{e.preventDefault();d.classList.remove("over");const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));if(fs.length)addPhotos(fs)}}
  bindCalc();
}
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#zoomRoot").innerHTML){$("#zoomRoot").innerHTML="";return}if(sheetState)goBack()}});
function openZoom(src){const z=$("#zoomRoot");z.innerHTML=`<div class="zoom" role="dialog" aria-label="Portada ampliada. Toca para cerrar"><img alt="Portada ampliada"></div>`;z.querySelector("img").src=src;z.firstChild.onclick=()=>{z.innerHTML=""}}
document.addEventListener("click",e=>{const im=e.target.closest(".rev .ph img, .detailhead .cover img");if(!im)return;e.preventDefault();e.stopPropagation();openZoom(im.currentSrc||im.src)},true);
document.addEventListener("paste",e=>{
  const files=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  const box=$("#pasteBox");
  if(sheetState?.type==="ref"){if(!files.length&&e.target.id!=="refPaste")return;e.preventDefault();if(box)box.textContent="";const rp=$("#refPaste");if(rp)rp.textContent="";
    if(files.length){toast("Recortando la caja…");setRefBox(sheetState.q,files[0]).then(()=>{if(sheetState?.type==="ref")drawRefSheet()})}else toast("Lo pegado no es una imagen. En Google, mantén pulsada la imagen y elige «Copiar imagen».");return}
  if(S.route!=="catalogar"||sheetState)return;
  if(!files.length&&e.target!==box)return;
  e.preventDefault();if(box)box.textContent="";
  if(files.length){addPhotos(files)}else toast("Lo pegado no es una imagen. Copia la foto desde la galería.");
});

route();boot();
})();
