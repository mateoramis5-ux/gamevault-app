<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101219">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>GameVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: estantería — barra lateral fija en escritorio, barra inferior en móvil; contenido en rejilla de cajas */
:root{
  --bg:#101219; --surface:#171a23; --raised:#1f2330; --line:#2b3040; --fg:#e7e9f0; --muted:#8d93a6;
  --accent:#f0b545; --accent-ink:#1a1408; --good:#4cc38a; --warn:#e9a23b; --bad:#ef6461; --info:#6aa8ff;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f2ee; --surface:#ffffff; --raised:#f7f6f2; --line:#dcdad2; --fg:#1b1d24; --muted:#656a78;
  --accent:#b9780b; --accent-ink:#fff; --good:#1f8a57; --warn:#a96a08; --bad:#c53d3a; --info:#2f6fd0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f2ee; --surface:#ffffff; --raised:#f7f6f2; --line:#dcdad2; --fg:#1b1d24; --muted:#656a78;
  --accent:#b9780b; --accent-ink:#fff; --good:#1f8a57; --warn:#a96a08; --bad:#c53d3a; --info:#2f6fd0; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;padding:18px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.brand i{width:26px;height:30px;border-radius:4px 4px 2px 2px;background:var(--accent);position:relative;display:block}
.brand i::after{content:"";position:absolute;left:5px;right:5px;bottom:4px;height:6px;border-radius:1px;background:var(--accent-ink);opacity:.5}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--raised)}
.nav a[aria-current="page"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
.nav a.off{color:var(--muted);pointer-events:none}
.nav .tag{font:500 .68rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav .count{font:500 .72rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px}
.navsep{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 10px 4px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.search input{border:0;background:transparent;outline:0;width:100%}
.view{padding-block:22px 110px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:transparent;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 .72rem var(--f-mono);border-radius:5px;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.mut{color:var(--muted)}
.plat{display:inline-block;font:600 .68rem var(--f-mono);letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--fg)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font:600 1.55rem var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:.78rem;color:var(--muted)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:16px}
.box{display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.cover{aspect-ratio:105/170;width:100%;max-width:100%;border-radius:6px;background:var(--raised);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{font:600 .75rem var(--f-display);color:var(--muted);text-align:center;padding:10px}
.cover .band{position:absolute;inset:0 0 auto;height:9%;opacity:.9}
.cover .n{position:absolute;right:6px;bottom:6px;font:600 .72rem var(--f-mono);background:var(--bg);color:var(--fg);border-radius:4px;padding:0 6px;border:1px solid var(--line)}
.box .t{font-weight:600;font-size:.88rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box:hover .cover{border-color:var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--raised)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--raised)}
tr.click{cursor:pointer}
.thumb{width:30px;height:46px;border-radius:3px;object-fit:cover;background:var(--raised);display:block}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.92rem;color:var(--fg);width:100%;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.checks label{display:flex;gap:6px;align-items:center}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:52ch;margin:0;color:var(--muted)}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:.88rem}
.banner.info{border-left-color:var(--info)}

.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent)}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rev .ph{width:170px;aspect-ratio:105/170;border-radius:6px;overflow:hidden;background:var(--raised);border:1px solid var(--line);cursor:zoom-in}
.rev .ph img{width:100%;height:100%;object-fit:cover;display:block}
.scanwrap{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.scanview{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:4/3;max-height:62vh;background:#05060a;border-radius:10px;overflow:hidden}
.scanview video{width:100%;height:100%;object-fit:cover;display:block}
.scanguide{position:absolute;inset:20% 7%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.scanguide span{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ef6461;box-shadow:0 0 8px #ef6461}
@media (prefers-reduced-motion:no-preference){.scanguide span{animation:scanl 1.6s ease-in-out infinite alternate}@keyframes scanl{from{top:15%}to{top:85%}}}
.scanidle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;background:rgba(5,6,10,.82);color:#e7e9f0}
.scanidle p{max-width:46ch;margin:0;color:#c9ccd6}
.btn.big{font-size:1.1rem;padding:12px 22px}
.scanflash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
.scanflash.ok{background:rgba(76,195,138,.45);opacity:1;transition:none}.scanflash.bad{background:rgba(239,100,97,.4);opacity:1;transition:none}
.scanstatus{text-align:center;font-weight:600;padding:10px 12px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.scanstatus[data-k="ok"]{color:var(--good);border-color:var(--good)}.scanstatus[data-k="bad"]{color:var(--bad);border-color:var(--bad)}.scanstatus[data-k="warn"]{color:var(--warn);border-color:var(--warn)}
.scanitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;flex-wrap:wrap}
.si-img{width:48px;aspect-ratio:105/170;border-radius:4px;background:var(--raised);overflow:hidden;flex:none}.si-img img{width:100%;height:100%;object-fit:cover}
.eanlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.eanlinks .chip{text-decoration:none;color:var(--fg);font-size:.82rem;padding:5px 10px}
#syncBox{position:fixed;z-index:35;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;min-width:190px;max-width:260px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35);color:var(--fg);text-decoration:none;font-size:.78rem}
#syncBox .sb-b{color:var(--accent);font-size:.74rem}#syncBox .sb-b:empty{display:none}
.propgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}.propitem{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--raised)}.propitem .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.propitem figure{margin:0;display:flex;flex-direction:column;gap:4px}
#syncBox .sb-l{color:var(--muted)}#syncBox .sb-n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1rem}#syncBox .sb-a{color:var(--good);font-size:.74rem}
#syncBox .sb-bar{height:4px;background:var(--raised);border-radius:2px;overflow:hidden}#syncBox .sb-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:no-preference){#syncBox .sb-bar.ind i{animation:sbind 1.2s ease-in-out infinite alternate}@keyframes sbind{from{margin-left:0}to{margin-left:85%}}}
@media (max-width:860px){#syncBox{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.refshelf .box{content-visibility:auto;contain-intrinsic-size:auto 230px}
.refshelf .cover{background:var(--raised)}
.zoom{position:fixed;inset:0;z-index:80;background:rgba(5,6,10,.94);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.detailhead .cover{cursor:zoom-in}
.rev .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.conf{height:5px;border-radius:3px;background:var(--raised);overflow:hidden;width:100px}
.conf i{display:block;height:100%}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.85rem}
.bar .track{height:12px;background:var(--raised);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent)}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.sheet-bg{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;border-left:1px solid var(--line);display:flex;flex-direction:column}
.sheet header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));z-index:2}
.sheet .in{padding-block:18px 60px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.detailhead{display:grid;grid-template-columns:130px 1fr;gap:16px}
.copy{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);flex-wrap:wrap}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.9rem}
.calc .k{color:var(--muted)} .calc .v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.calc .tot{font-weight:600;color:var(--fg);border-top:1px solid var(--line);padding-top:4px}
.crop-bg{position:fixed;inset:0;z-index:70;background:rgba(5,6,10,.92);display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.crop-bg h2{color:#fff;font-size:1.05rem}
.crop-bg p{color:#c9ccd6;margin:0;font-size:.85rem;text-align:center;max-width:52ch}
.crop-stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.crop-wrap{position:relative;touch-action:none;max-width:100%;max-height:100%}
.crop-wrap img{display:block;max-width:100%;max-height:calc(100vh - 210px);user-select:none;-webkit-user-drag:none}
.crop-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.crop-h{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;background:rgba(240,181,69,.85);touch-action:none;cursor:grab;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.crop-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:500;font-size:.9rem;max-width:90vw}
details.plan summary{cursor:pointer;font-weight:600}
details.plan p,details.plan li{max-width:72ch;color:var(--fg)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
.pastebox{min-height:52px;width:min(100%,460px);border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:.85rem;text-align:left;outline:0;color:var(--muted)}
.pastebox:empty::before{content:attr(data-ph)}
.pastebox:focus{border-color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;top:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:30;overflow-x:auto;gap:2px}
  .brand,.navsep,.nav a.off{display:none}
  .nav{display:contents}
  .nav a{flex-direction:column;gap:0;font-size:.68rem;padding:6px 8px;min-width:64px;text-align:center}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .nav .count{font-size:.62rem}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .rev{grid-template-columns:auto minmax(0,1fr)}
  .detailhead{grid-template-columns:96px 1fr}
  .bar{grid-template-columns:80px 1fr 56px}
  .top .hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){.box .cover{transition:border-color .15s}}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i>GAMEVAULT</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <label class="search" for="q"><span class="muted" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Buscar título, consola, EAN…" autocomplete="off"></label>
      <button class="btn primary hide-s" id="topAdd">Catalogar</button>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="sheetRoot"></div>
<div id="cropRoot"></div>
<a id="syncBox" href="#catalogo" hidden aria-live="polite"><span class="sb-l">Actualizando catálogo</span><b class="sb-n">…</b><span class="sb-bar"><i></i></span><span class="sb-a"></span><span class="sb-b"></span></a>
<div id="zoomRoot"></div>
<datalist id="pcNames"></datalist>
<div class="toast" id="toast" hidden></div>
<input type="file" id="hiddenFile" class="vh" accept="image/*">

<script>
(()=>{
"use strict";
/* ---------- Constantes ---------- */
const DEFAULT_PLATFORMS=[
 {id:"switch",name:"Nintendo Switch",short:"NSW",color:"#e60012"},
 {id:"switch2",name:"Nintendo Switch 2",short:"NS2",color:"#ff4d6d"},
 {id:"wii",name:"Wii",short:"WII",color:"#9aa4b4"},
 {id:"wiiu",name:"Wii U",short:"WIIU",color:"#1fa7d8"},
 {id:"snes",name:"Super Nintendo",short:"SNES",color:"#8a6fd1"},
 {id:"n64",name:"Nintendo 64",short:"N64",color:"#3c8f4e"},
 {id:"gc",name:"GameCube",short:"GC",color:"#6750a4"},
 {id:"xbox",name:"Xbox",short:"XBOX",color:"#2f8f2f"},
 {id:"x360",name:"Xbox 360",short:"X360",color:"#78b13f"}];
const STATUS={coleccion:["Colección personal","info"],venta:["Disponible para venta","good"],reservado:["Reservado","warn"],vendido:["Vendido","mut"],retirado:["Retirado","mut"]};
const CONDITION=["Desconocido","Precintado","Como nuevo","Muy bueno","Bueno","Aceptable","Dañado"];
const REGIONS=["PAL-ES","PAL-EU","PAL-UK","NTSC-U","NTSC-J","Asia","Desconocida"];
const PRICE_TYPES={venta:"Venta completada",anuncio:"Anuncio",nuevo:"Precio nuevo en tienda",manual:"Estimación manual"};
const SOURCES=["PriceCharting","eBay","Wallapop","Vinted","CeX","Tienda","Manual","Otra"];
const DEFAULT_SETTINGS={margin:10,platforms:DEFAULT_PLATFORMS,channels:[
 {name:"Wallapop",pct:0,fixed:0,ship:0,pack:0},{name:"eBay",pct:0,fixed:0,ship:0,pack:0},
 {name:"Vinted",pct:0,fixed:0,ship:0,pack:0},{name:"CeX",pct:0,fixed:0,ship:0,pack:0},
 {name:"Venta directa",pct:0,fixed:0,ship:0,pack:0}],feesChecked:false,usdEur:null,usdEurDate:""};
const PC_CONSOLE={switch:"Nintendo Switch",switch2:"Nintendo Switch 2",wii:"Wii",wiiu:"Wii U",snes:"Super Nintendo",n64:"Nintendo 64",gc:"Gamecube",xbox:"Xbox",x360:"Xbox 360"};
const EAN_SITES=[["Google","https://www.google.com/search?q=%22{c}%22"],["CeX España","https://es.webuy.com/search?stext={c}"],["Amazon.es","https://www.amazon.es/s?k={c}"],["eBay","https://www.ebay.es/sch/i.html?_nkw={c}"],["PriceCharting","https://www.pricecharting.com/search-products?type=prices&q={c}"],["EAN-Search","https://www.ean-search.org/?q={c}"],["UPCitemdb","https://www.upcitemdb.com/upc/{c}"],["Barcode Lookup","https://www.barcodelookup.com/{c}"],["Google Imágenes","https://www.google.com/search?tbm=isch&q={c}"]];
function eanLinks(code){if(!code)return"";return `<div class="eanlinks"><span class="small muted">Buscar ${esc(code)} en:</span>${EAN_SITES.map(([n,u])=>`<a class="chip" target="_blank" rel="noopener" href="${esc(u.replace("{c}",encodeURIComponent(code)))}">${n} ↗</a>`).join("")}</div>`}
const PC_COND={Precintado:"new",Completo:"cib","Sin manual":"cib",Suelto:"loose"};
const COL={titles:"gv_titles",copies:"gv_copies",prices:"gv_prices",review:"gv_review"};
const NB=8;

/* ---------- Estado ---------- */
const S={titles:new Map(),copies:new Map(),prices:new Map(),review:new Map(),settings:structuredClone(DEFAULT_SETTINGS),
  db:null,assets:null,sample:null,dl:null,dbState:"cargando",route:"inicio",q:"",
  f:{plat:"all",status:"all",layout:"grid",sort:"name",missing:false},loaded:new Set()};
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,"").slice(0,20);
const bucket=(id,n=NB)=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return h%n};
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return Number.isFinite(n)?n:null};
const eur=v=>v==null||!Number.isFinite(v)?"—":v.toLocaleString("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const eur0=v=>v==null?"—":v.toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+"T00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}):"—";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const plat=id=>S.settings.platforms.find(p=>p.id===id)||{id,name:id||"Sin consola",short:(id||"?").toUpperCase(),color:"#888"};
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const blobUrl=id=>id?"/_blob/"+encodeURIComponent(id):"";
const coverSrc=t=>t?.coverId?blobUrl(t.coverId):(t?.coverData||t?.coverUrl||"");
function toast(m,ms){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2600)}
let pickLost=null;

/* ---------- Persistencia ---------- */
const chains=new Map();
function write(col,id,data){
  const map=S[Object.keys(COL).find(k=>COL[k]===col)];
  if(data===null)map.delete(id);else map.set(id,data);
  schedule();
  if(S.idb)return idbOp(data===null?"delete":"put",col+"/"+id,data);
  if(!S.db)return Promise.resolve();
  const key=col+"/"+id;
  const run=async()=>{
    for(let i=0;i<4;i++){
      try{const ref=S.db.collection(col).doc(id);data===null?await ref.delete():await ref.set(data);return}
      catch(e){
        if(e?.code==="quota_exceeded"){toast("Almacenamiento lleno: elimina registros o exporta y archiva.");return}
        if(e?.code==="invalid_argument"){toast("No tienes permiso para guardar cambios aquí.");return}
        await new Promise(r=>setTimeout(r,400*(i+1)+Math.random()*300));
      }}
    toast("No se pudo guardar un cambio. Revisa la conexión.");
  };
  const p=(chains.get(key)||Promise.resolve()).then(run);chains.set(key,p);return p;
}
const saveTitle=t=>write(COL.titles,t.id,strip(t));
const saveCopy=c=>write(COL.copies,c.id,strip(c));
const savePrice=p=>write(COL.prices,p.id,strip(p));
const saveReview=r=>write(COL.review,r.id,strip(r));
function strip(o){const d={...o};d.b=bucket(o.id);d.updatedAt=new Date().toISOString();return d}
async function saveSettings(){schedule();if(S.idb){idbOp("put","settings",S.settings);return}if(S.db){try{await S.db.doc("gv_meta/settings").set(S.settings)}catch(e){toast("No se pudo guardar la configuración.")}}}

function subscribe(){
  for(const [key,col] of Object.entries(COL)){
    for(let b=0;b<NB;b++){
      S.db.collection(col).where("b","==",b).onSnapshot(snap=>{
        for(const ch of snap.docChanges()){
          if(ch.type==="removed")S[key].delete(ch.doc.id);
          else S[key].set(ch.doc.id,{...ch.doc.data(),id:ch.doc.id});
        }
        S.loaded.add(col+b);schedule();
      },()=>{S.loaded.add(col+b);schedule()});
    }
  }
  S.db.doc("gv_meta/settings").onSnapshot(s=>{if(s.exists){S.settings={...structuredClone(DEFAULT_SETTINGS),...s.data()};schedule()}},()=>{});
}
/* ---------- Modo local (archivo HTML en el navegador) ---------- */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("gamevault",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbOp(op,key,val){return new Promise(res=>{try{const tx=S.idb.transaction("kv","readwrite");const st=tx.objectStore("kv");op==="put"?st.put(val,key):st.delete(key);tx.oncomplete=()=>res();tx.onerror=()=>{toast("No se pudo guardar en este dispositivo. ¿Queda espacio?");res()}}catch{res()}})}
async function initLocal(){
  if(S.idb||S.db)return;
  try{
    S.idb=await idbOpen();
    const tx=S.idb.transaction("kv","readonly"),st=tx.objectStore("kv");
    // carga todo menos las carátulas guardadas (se leen solo cuando se ven)
    const rq=r=>new Promise(ok=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ok([])});
    const lo=IDBKeyRange.upperBound("refimg/",true),hi=IDBKeyRange.lowerBound("refimg0");
    const [k1,v1,k2,v2]=await Promise.all([rq(st.getAllKeys(lo)),rq(st.getAll(lo)),rq(st.getAllKeys(hi)),rq(st.getAll(hi))]);
    const keys=[...k1,...k2],vals=[...v1,...v2];
    keys.forEach((k,i)=>{if(k==="settings"){S.settings={...structuredClone(DEFAULT_SETTINGS),...vals[i]};return}
      if(k==="refcat"){try{REF.deleted=new Set(vals[i].deleted||[]);REF.props=vals[i].props||[];REF.deletedNames=new Set(vals[i].deletedNames||[]);setRef(vals[i].list||[],vals[i].date)}catch(e){console.error("refcat",e)}return}
      if(k==="pcrows"){try{buildPcIndex(vals[i].list||[],vals[i].date)}catch{}return}
      const [col,id]=String(k).split("/");const m=Object.keys(COL).find(x=>COL[x]===col);if(m&&id)S[m].set(id,{...vals[i],id})});
    try{navigator.storage?.persist?.()}catch{}
    S.dbState="device";setTimeout(autoSync,500);setTimeout(resumeAfterReload,300);
  }catch{S.dbState="local"}
  if(!S.dl&&window.AndroidBridge)S.dl={save:async({filename,data})=>{const ok=AndroidBridge.saveFile(filename,typeof data==="string"?data:await data.text());toast(ok?"Guardado en Descargas: "+filename:"No se pudo guardar el archivo.",5000)}};
  if(!S.dl)S.dl={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"}));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  if(!S.sample)S.sample=localSample();
  schedule();
}
function apiKey(){try{return localStorage.getItem("gv-key")||""}catch{return""}}
function apiModel(){try{return localStorage.getItem("gv-model")||"claude-sonnet-5-5"}catch{return"claude-sonnet-5-5"}}
function localSample(){
  const b64=blob=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob)});
  const f={limits:async()=>apiKey()?{images:{maxCount:5}}:{},
    json:async(prompt,opts={})=>{
      const key=apiKey();if(!key)throw{code:"not_granted"};
      const content=[];for(const im of opts.images||[])content.push({type:"image",source:{type:"base64",media_type:im.type||"image/jpeg",data:await b64(im)}});
      content.push({type:"text",text:prompt});
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:apiModel(),max_tokens:4096,messages:[{role:"user",content}]})});
      if(r.status===429)throw{code:"rate_limited"};
      if(!r.ok){let m="";try{m=(await r.json())?.error?.message||""}catch{}toast("Error de la API: "+(m||r.status));throw{code:"api_error"}}
      const j=await r.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      const a=txt.indexOf("{"),z=txt.lastIndexOf("}");if(a<0)throw{code:"invalid_json"};return JSON.parse(txt.slice(a,z+1));
    }};
  return f;
}
async function boot(){
  const c=window.claude;
  if(!c?.use){initLocal();return}
  const fb=setTimeout(()=>{if(!S.db)initLocal()},10000);
  c.use("db").then(db=>{
    if(!db){clearTimeout(fb);initLocal();return}
    clearTimeout(fb);S.db=db;S.dbState="ok";subscribe();schedule();loadRefFromDb();
  }).catch(()=>{clearTimeout(fb);initLocal()});
  c.use("assets").then(a=>{S.assets=a}).catch(()=>{});
  c.use("sample").then(s=>{S.sample=s;schedule()}).catch(()=>{});
  c.use("downloads").then(d=>{S.dl=d}).catch(()=>{});
}

/* ---------- Render programado ---------- */
let raf=0,pendingRender=false;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
  const a=document.activeElement;
  if(a&&$("#view").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return}
  render()})}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(schedule,0)}});

/* ---------- Derivados ---------- */
function copiesOf(tid){return [...S.copies.values()].filter(c=>c.titleId===tid)}
function pricesOf(tid){return [...S.prices.values()].filter(p=>p.titleId===tid).sort((a,b)=>(b.date||"").localeCompare(a.date||""))}
function market(tid,cond){
  const now=Date.now(),all=pricesOf(tid);
  const pick=(type,days)=>all.filter(p=>p.type===type&&(!days||now-new Date(p.date)<days*864e5)&&(!cond||!p.cond||p.cond===cond)).map(p=>p.price).filter(v=>v!=null);
  let v=pick("venta",180);
  if(v.length>=3)return{value:median(v),n:v.length,basis:"ventas completadas (180 días)",conf:v.length>=6?"alta":"media",min:Math.min(...v),max:Math.max(...v)};
  const g=guideEUR(S.titles.get(tid),cond);
  if(g)return{value:g.value,n:1,basis:`guía ${g.src}${g.cur!=="EUR"?" (USD→EUR)":""} del ${fdate(g.date)}${g.regionNote}`,conf:"media",guide:true};
  const a=pick("anuncio",60);
  if(a.length>=3)return{value:median(a)*0.9,n:a.length,basis:"anuncios activos (−10 %, no son ventas)",conf:"baja",min:Math.min(...a),max:Math.max(...a)};
  if(v.length){return{value:median(v),n:v.length,basis:"pocas ventas completadas",conf:"baja",min:Math.min(...v),max:Math.max(...v)}}
  const m=all.find(p=>p.type==="manual");
  if(m)return{value:m.price,n:1,basis:"estimación manual del "+fdate(m.date),conf:"manual"};
  return null;
}
function guideEUR(t,cond){
  const g=t?.guide;if(!g)return null;const k=cond?PC_COND[cond]||"cib":"cib";
  const p=g[k]??g.cib??g.loose;if(p==null)return null;
  const rate=g.cur==="EUR"?1:num(S.settings.usdEur);if(!rate)return null;
  const pal=/^PAL/i.test(g.console||""),own=String(t.region||"");
  const regionNote=!pal&&own.startsWith("PAL")?" · referencia NTSC, tu edición es PAL":"";
  return{value:p*rate,src:g.src||"PriceCharting",cur:g.cur||"USD",date:g.date,regionNote};
}
function guideSeries(t){const rate=t?.guide?.cur==="EUR"?1:num(S.settings.usdEur);if(!rate)return[];return (t.gh||[]).map(([d,l,c])=>({d,v:(c??l)*rate})).filter(p=>p.v!=null&&Number.isFinite(p.v)).sort((a,b)=>a.d.localeCompare(b.d))}
function variation(series,days){
  if(series.length<2)return null;const last=series[series.length-1];const lim=new Date(new Date(last.d)-days*864e5).toISOString().slice(0,10);
  const far=new Date(new Date(last.d)-days*1.5*864e5).toISOString().slice(0,10);
  const prev=[...series].reverse().find(p=>p.d<=lim);if(!prev||!prev.v||prev.d<far)return null;return (last.v-prev.v)/prev.v*100;
}
function salesVariation(tid,days){
  const now=Date.now(),ps=pricesOf(tid).filter(p=>p.type==="venta"&&p.price!=null);
  const rec=ps.filter(p=>now-new Date(p.date)<days*864e5).map(p=>p.price),old=ps.filter(p=>{const a=now-new Date(p.date);return a>=days*864e5&&a<2*days*864e5}).map(p=>p.price);
  if(rec.length<3||old.length<3)return null;return (median(rec)-median(old))/median(old)*100;
}
function copyCost(c){return (num(c.cost)||0)+(num(c.extra)||0)}
function channel(name){return S.settings.channels.find(c=>c.name===name)||{name,pct:0,fixed:0,ship:0,pack:0}}
function calc({cost,price,pct=0,fixed=0,ship=0,pack=0,other=0,target=S.settings.margin}){
  const fees=price!=null?price*pct/100+fixed:null;
  const net=price!=null?price-fees-ship-pack-other-cost:null;
  const minP=(1-pct/100)>0?(cost+ship+pack+other+fixed+target)/(1-pct/100):null;
  return{fees,net,minP,roi:net!=null&&cost>0?net/cost*100:null};
}
function saleNet(c){const s=c.sale||{};return (num(s.price)||0)-(num(s.fees)||0)-(num(s.ship)||0)-(num(s.pack)||0)-(num(s.other)||0)-copyCost(c)}
function stats(){
  const cs=[...S.copies.values()],stock=cs.filter(c=>c.status!=="vendido"&&c.status!=="retirado"),sold=cs.filter(c=>c.status==="vendido");
  let val=0,covered=0;const byPlat={};
  for(const c of stock){const t=S.titles.get(c.titleId);const p=t?.platform||"?";byPlat[p]??={copies:0,cost:0,value:0};byPlat[p].copies++;byPlat[p].cost+=copyCost(c);
    const m=market(c.titleId);if(m){val+=m.value;covered++;byPlat[p].value+=m.value}}
  const realized=sold.reduce((s,c)=>s+saleNet(c),0),recovered=sold.reduce((s,c)=>s+(num(c.sale?.price)||0)-(num(c.sale?.fees)||0)-(num(c.sale?.ship)||0)-(num(c.sale?.pack)||0),0);
  const invested=stock.reduce((s,c)=>s+copyCost(c),0),noCost=stock.filter(c=>num(c.cost)==null).length;
  const coveredCost=stock.filter(c=>market(c.titleId)).reduce((s,c)=>s+copyCost(c),0);
  return{cs,stock,sold,val,covered,byPlat,realized,recovered,invested,noCost,potential:covered?val-coveredCost:null};
}

/* ---------- Navegación ---------- */
const ROUTES=[["inicio","Inicio"],["coleccion","Mi colección"],["escanear","Escanear códigos"],["catalogo","Catálogo Switch"],["catalogar","Catalogación"],["mercado","Mercado y precios"],["ventas","Compras y ventas"],["ajustes","Configuración"]];
const LATER=[["Oportunidades","F7"],["Alertas","F7"],["Lista de deseos","F7"],["Informes PDF","F8"]];
function renderNav(){
  const rc=S.review.size;
  $("#nav").innerHTML=ROUTES.map(([id,l])=>`<a href="#${id}" ${S.route===id?'aria-current="page"':""}><span>${l}</span>${id==="catalogar"&&rc?`<span class="count">${rc}</span>`:""}</a>`).join("")
   +`<div class="navsep">Próximas fases</div>`+LATER.map(([l,f])=>`<a class="off" aria-disabled="true"><span>${l}</span><span class="tag">${f}</span></a>`).join("");
}
function route(){const h=location.hash.slice(1);S.route=ROUTES.some(r=>r[0]===h)?h:"inicio";render();window.scrollTo(0,0)}
addEventListener("hashchange",route);
document.addEventListener("input",e=>{if(e.target.id==="refQ"){REF.q=e.target.value;REF.limit=120;clearTimeout(REF.t);REF.t=setTimeout(()=>{const pos=e.target.selectionStart;render();const i=$("#refQ");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch{}}},250)}});
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(S.q&&S.route!=="coleccion"){location.hash="coleccion"}else render()});
$("#topAdd").onclick=()=>location.hash="catalogar";
$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");r.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("gv-theme",r.dataset.theme)}catch{}};
try{const t=localStorage.getItem("gv-theme");if(t)document.documentElement.dataset.theme=t}catch{}

function fitRevPhotos(){
  const narrow=innerWidth<600;
  document.querySelectorAll(".rev").forEach(card=>{const ph=card.querySelector(".ph"),body=card.querySelector(".body");if(!ph||!body)return;
    if(narrow){ph.style.width="110px";return}
    for(let i=0;i<3;i++){const w=Math.round(Math.max(150,Math.min(card.clientWidth*.45,body.offsetHeight*105/170)));if(Math.abs(ph.offsetWidth-w)<2)break;ph.style.width=w+"px"}});
}
addEventListener("resize",()=>{clearTimeout(fitRevPhotos.t);fitRevPhotos.t=setTimeout(fitRevPhotos,120)});
function render(){renderNav();const v=$("#view");
  if(S.route==="escanear"){if(!$("#scanUI")){v.innerHTML=scanHTML();bindScan()}updateScanList();return}
  if(SC.stream)stopScanner();
  const loading=S.dbState==="cargando"||(S.db&&S.loaded.size<Object.keys(COL).length*NB);
  if(!loading&&S.dbState!=="local"&&!migrateCrops.started){migrateCrops.started=true;setTimeout(()=>migrateCrops(false),1200)}
  let h="";
  if(S.dbState==="local")h+=`<div class="banner">Este navegador no permite guardar datos: los cambios se perderán al cerrar. Ábrelo en Chrome o Safari normal (no en modo privado).</div>`;
  if(S.dbState==="device"&&S.route==="inicio")h+=`<div class="banner info">Tus datos se guardan en este dispositivo y este navegador. Descarga una copia de seguridad de vez en cuando en Configuración.</div>`;
  if(loading&&S.dbState!=="local")h+=`<div class="banner info">Cargando tu colección…</div>`;
  h+=({catalogo:vCatalogo,inicio:vInicio,coleccion:vColeccion,catalogar:vCatalogar,mercado:vMercado,ventas:vVentas,ajustes:vAjustes}[S.route])();
  v.innerHTML=h;bindView();if(S.route==="catalogar")fitRevPhotos();if(S.route==="catalogo"){hydrateRefImgs();hydratePropImgs();appendRefRest()}}

function platPill(id){const p=plat(id);return `<span class="plat" style="box-shadow:inset 3px 0 0 ${esc(p.color)}">${esc(p.short)}</span>`}
function statusPill(s){const [l,k]=STATUS[s]||["—","mut"];return `<span class="pill ${k}">${l}</span>`}
function coverHTML(t,n){const src=coverSrc(t);const p=plat(t?.platform);
  return `<div class="cover"><span class="band" style="background:${esc(p.color)}"></span>${src?`<img src="${esc(src)}" alt="Portada de ${esc(t.name)}" loading="lazy">`:`<span class="ph">${esc(t?.name||"")}<br><span class="pill warn" style="margin-top:6px">Sin portada</span></span>`}${n?`<span class="n">×${n}</span>`:""}</div>`}

/* ---------- Inicio ---------- */
function vInicio(){
  const st=stats();const nT=S.titles.size;
  const ex=[...S.titles.values()].some(t=>t.ejemplo);
  let h=`<div class="tbar"><h1>Inicio</h1><div class="row"><a class="btn" href="#coleccion">Ver colección</a><a class="btn primary" href="#catalogar">Catalogar juegos</a></div></div>`;
  if(ex)h+=`<div class="banner info row between"><span>Hay juegos de <b>ejemplo</b> para que veas cómo funciona. Elimínalos cuando empieces con tu colección.</span><button class="btn" data-act="clearEx">Eliminar ejemplos</button></div>`;
  if(!nT&&S.dbState!=="cargando")return h+`<div class="empty"><h2>Tu estantería está vacía</h2><p>Empieza por un lote de prueba de 20–30 juegos: fotografía varias cajas a la vez, revisa lo que se detecta y confirma. Después podrás completar costes y precios.</p><a class="btn primary" href="#catalogar">Catalogar el primer lote</a></div>`;
  h+=`<div class="kpis">
   <div class="kpi"><div class="l">Títulos</div><div class="v">${nT}</div><div class="s">${st.cs.length} copias en total</div></div>
   <div class="kpi"><div class="l">Copias en existencias</div><div class="v">${st.stock.length}</div><div class="s">${st.stock.filter(c=>c.status==="venta").length} a la venta</div></div>
   <div class="kpi"><div class="l">Capital invertido</div><div class="v">${eur0(st.invested)}</div><div class="s">${st.noCost?`${st.noCost} copias sin coste`:"coste de existencias"}</div></div>
   <div class="kpi"><div class="l">Valor estimado</div><div class="v">${st.covered?eur0(st.val):"—"}</div><div class="s">${st.covered} de ${st.stock.length} copias con precio</div></div>
   <div class="kpi"><div class="l">Beneficio realizado</div><div class="v" style="color:${st.realized>=0?"var(--good)":"var(--bad)"}">${eur0(st.realized)}</div><div class="s">${st.sold.length} ventas · recuperado ${eur0(st.recovered)}</div></div>
   <div class="kpi"><div class="l">Revalorización no realizada</div><div class="v">${st.potential==null?"—":eur0(st.potential)}</div><div class="s">solo copias con precio</div></div></div>`;
  const plats=Object.entries(st.byPlat).sort((a,b)=>b[1].copies-a[1].copies);
  const maxC=Math.max(1,...plats.map(p=>p[1].copies));
  const totCost=plats.reduce((s,p)=>s+p[1].cost,0);
  let acc=0;const seg=plats.filter(p=>p[1].cost>0).map(([id,v])=>{const a=acc/totCost*360;acc+=v.cost;return `${plat(id).color} ${a}deg ${acc/totCost*360}deg`});
  h+=`<div class="grid2"><div class="panel"><h3>Copias por consola</h3><div class="bars" style="margin-top:12px">${plats.map(([id,v])=>`<div class="bar"><span>${esc(plat(id).name)}</span><span class="track"><i style="width:${v.copies/maxC*100}%;background:${esc(plat(id).color)}"></i></span><span class="mono" style="text-align:right">${v.copies}</span></div>`).join("")||'<p class="muted">Sin datos.</p>'}</div></div>
   <div class="panel"><h3>Capital por consola</h3>${totCost>0?`<div class="row" style="margin-top:12px;gap:22px;flex-wrap:nowrap"><div class="donut" style="background:conic-gradient(${seg.join(",")})" role="img" aria-label="Capital invertido por consola"></div><div class="legend">${plats.filter(p=>p[1].cost>0).map(([id,v])=>`<span><i style="background:${esc(plat(id).color)}"></i>${esc(plat(id).short)} <span class="mono muted">${eur0(v.cost)}</span></span>`).join("")}</div></div>`:`<p class="muted small" style="margin-top:10px">Añade el coste de adquisición a tus copias para ver cómo se reparte el capital.</p>`}</div></div>`;
  const nocover=[...S.titles.values()].filter(t=>!coverSrc(t)).length,noprice=[...S.titles.values()].filter(t=>!market(t.id)).length;
  h+=`<div class="panel"><h3>Pendiente de revisar</h3><div class="tablewrap" style="margin-top:10px;border:0"><table><tbody>
   <tr class="click" data-go="catalogar"><td>Identificaciones en la bandeja de revisión</td><td class="num">${S.review.size}</td></tr>
   <tr class="click" data-go="coleccion" data-missing="cover"><td>Títulos sin portada</td><td class="num">${nocover}</td></tr>
   <tr class="click" data-go="coleccion" data-missing="cost"><td>Copias sin coste de adquisición</td><td class="num">${st.noCost}</td></tr>
   <tr class="click" data-go="mercado"><td>Títulos sin datos de precio</td><td class="num">${noprice}</td></tr></tbody></table></div></div>`;
  return h;
}

/* ---------- Colección ---------- */
function filteredTitles(){
  const q=norm(S.q);let ts=[...S.titles.values()];
  if(S.f.plat!=="all")ts=ts.filter(t=>t.platform===S.f.plat);
  if(q)ts=ts.filter(t=>norm([t.name,plat(t.platform).name,plat(t.platform).short,t.ean,t.edition,t.publisher].join(" ")).includes(q));
  if(S.f.status!=="all")ts=ts.filter(t=>copiesOf(t.id).some(c=>c.status===S.f.status));
  if(S.f.missing==="cover")ts=ts.filter(t=>!coverSrc(t));
  if(S.f.missing==="cost")ts=ts.filter(t=>copiesOf(t.id).some(c=>num(c.cost)==null&&c.status!=="vendido"));
  const k=S.f.sort;
  ts.sort((a,b)=>k==="value"?((market(b.id)?.value||0)-(market(a.id)?.value||0)):k==="new"?(b.createdAt||"").localeCompare(a.createdAt||""):a.name.localeCompare(b.name,"es"));
  return ts;
}
function vColeccion(){
  const used=new Set([...S.titles.values()].map(t=>t.platform));
  const ts=filteredTitles();
  let h=`<div class="tbar"><h1>Mi colección</h1><div class="row"><button class="btn" data-act="newTitle">Añadir manualmente</button></div></div>
  <div class="chips">${[["all","Todas"],...S.settings.platforms.filter(p=>used.has(p.id)).map(p=>[p.id,p.short])].map(([id,l])=>`<button class="chip" data-plat="${esc(id)}" aria-pressed="${S.f.plat===id}">${esc(l)}</button>`).join("")}</div>
  <div class="tbar"><div class="row">
    <select class="inp" id="fStatus" style="width:auto"><option value="all">Todos los estados</option>${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${S.f.status===k?"selected":""}>${l}</option>`).join("")}</select>
    <select class="inp" id="fSort" style="width:auto"><option value="name" ${S.f.sort==="name"?"selected":""}>Orden: título</option><option value="new" ${S.f.sort==="new"?"selected":""}>Orden: recientes</option><option value="value" ${S.f.sort==="value"?"selected":""}>Orden: valor</option></select>
    ${S.f.missing?`<button class="chip" aria-pressed="true" data-act="clearMissing">${S.f.missing==="cover"?"Sin portada":"Sin coste"} ✕</button>`:""}
  </div><div class="row"><span class="muted small">${ts.length} títulos</span>
    <button class="chip" data-layout="grid" aria-pressed="${S.f.layout==="grid"}">Cuadrícula</button><button class="chip" data-layout="table" aria-pressed="${S.f.layout==="table"}">Tabla</button></div></div>`;
  if(!ts.length)return h+`<div class="empty"><h2>${S.titles.size?"Nada coincide con la búsqueda":"Aún no hay juegos"}</h2><p>${S.titles.size?"Prueba con otro filtro o término.":"Fotografía tus cajas en Catalogación o añade un título a mano."}</p></div>`;
  const shown=ts.slice(0,S.limit||240);
  if(S.f.layout==="grid")h+=`<div class="shelf">${shown.map(t=>{const n=copiesOf(t.id).filter(c=>c.status!=="vendido").length;return `<button class="box" data-title="${t.id}">${coverHTML(t,n>1?n:0)}<span class="t">${esc(t.name)}</span><span class="row" style="gap:6px">${platPill(t.platform)}${t.ejemplo?'<span class="pill mut">Ejemplo</span>':""}</span></button>`}).join("")}</div>`;
  else h+=`<div class="tablewrap"><table><thead><tr><th></th><th>Título</th><th>Consola</th><th>Edición</th><th class="num">Copias</th><th class="num">Coste</th><th class="num">Valor est.</th></tr></thead><tbody>${shown.map(t=>{const cs=copiesOf(t.id).filter(c=>c.status!=="vendido");const m=market(t.id);const src=coverSrc(t);
    return `<tr class="click" data-title="${t.id}"><td>${src?`<img class="thumb" src="${esc(src)}" alt="">`:`<span class="thumb"></span>`}</td><td style="white-space:normal;min-width:180px">${esc(t.name)}</td><td>${platPill(t.platform)}</td><td>${esc(t.edition||"Estándar")}</td><td class="num">${cs.length}</td><td class="num">${eur(cs.reduce((s,c)=>s+copyCost(c),0)||null)}</td><td class="num">${m?eur(m.value*cs.length):'<span class="muted">—</span>'}</td></tr>`}).join("")}</tbody></table></div>`;
  if(ts.length>shown.length)h+=`<button class="btn" data-act="more">Mostrar más (${ts.length-shown.length})</button>`;
  return h;
}

/* ---------- Catalogación ---------- */

  const canAI=S.idb?!!apiKey():!!S.sample;
  let h=`<div class="tbar"><h1>Catalogación</h1></div>
  <div class="drop" id="drop"><h2>Añade juegos desde tus fotos</h2>
   <p class="muted" style="margin:0;max-width:58ch">Elige fotos de la galería o haz una foto. Si en la foto se ve el <b>código de barras</b> (parte trasera), GameVault lo lee y busca el juego automáticamente. Si es la portada, la usa como imagen y tú escribes el título. Todo pasa por la bandeja de revisión.</p>
   <div class="row" style="justify-content:center"><span class="btn primary filebtn">📷 Hacer foto<input type="file" id="camIn" accept="image/*" capture="environment" aria-label="Hacer foto con la cámara"></span><span class="btn filebtn">Elegir de la galería<input type="file" id="localIn" accept="image/*" multiple aria-label="Elegir fotos de la galería"></span></div>
   <span class="small muted" style="max-width:58ch">Mejor resultado: fotografía la <b>parte trasera</b> con el código de barras bien enfocado. GameVault lo lee y busca en internet el título, la imagen y la marca.</span>
   <span class="small muted" id="localStatus">${S.pcIndex?`Lista de juegos cargada: ${S.pcIndex.byId.size.toLocaleString("es-ES")} productos para identificar códigos de barras.`:"Consejo: importa la guía de PriceCharting en Mercado para que los códigos de barras se identifiquen solos. Sin ella, cada código se aprende la primera vez que escribes su título."}</span>
   ${canAI?`<div class="row" style="justify-content:center;border-top:1px solid var(--line);padding-top:10px;width:100%"><span class="btn filebtn">Reconocer varias cajas con IA (opcional)<input type="file" id="photoIn" accept="image/*" multiple aria-label="Reconocer con IA"></span></div><span class="small muted" id="aiStatus">Identifica varias cajas en una misma foto.</span>`:""}
   ${S.idb?"":`<div class="pastebox" id="pasteBox" contenteditable="true" role="textbox" aria-label="Pegar foto" data-ph="¿El botón no abre nada? Copia una foto en tu galería, mantén pulsado aquí y elige «Pegar»."></div>`}</div>
  <details class="panel"><summary style="cursor:pointer;font-weight:600">Otras formas de añadir: lista de texto o CSV</summary>
   <p class="small muted">Una línea por juego: <span class="mono">título; consola; edición; región; EAN</span>. Consola puede ser el nombre o la abreviatura (NSW, WII, GC…). Las líneas van a la bandeja de revisión, no directamente al catálogo.</p>
   <textarea class="inp" id="bulkTxt" rows="5" placeholder="Zelda Tears of the Kingdom; NSW&#10;Metroid Prime; GC; Player's Choice; PAL-ES"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" data-act="bulk">Añadir a la bandeja</button></div></details>`;
  const ok=rv.filter(r=>reviewReady(r));
  h+=`<div class="tbar"><h2>Bandeja de revisión <span class="muted mono">${rv.length}</span></h2>${rv.length?`<div class="row"><button class="btn" data-act="selReady">Seleccionar fiables (${ok.length})</button><button class="btn primary" data-act="confirmSel">Confirmar seleccionados</button></div>`:""}</div>`;
  if(!rv.length)return h+`<div class="empty"><p>No hay identificaciones pendientes. Las fotos analizadas aparecerán aquí para que las confirmes, corrijas o rechaces.</p></div>`;
  h+=`<p class="small muted" style="margin:0">Solo se pueden confirmar en lote las identificaciones con confianza de al menos 75 % y con título y consola. Las dudosas se confirman una a una.</p><div style="display:flex;flex-direction:column;gap:10px">`+rv.map(revCard).join("")+`</div>`;
  return h;
}
function reviewReady(r){return (r.conf??0)>=0.75&&r.name&&r.platform}
function matches(r){const n=norm(r.name);if(!n)return[];return [...S.titles.values()].filter(t=>t.platform===r.platform&&(norm(t.name)===n||norm(t.name).includes(n)||n.includes(norm(t.name)))).slice(0,5)}
function revCard(r){
  const c=r.conf??0,col=c>=.75?"var(--good)":c>=.5?"var(--warn)":"var(--bad)";
  const ms=matches(r);const sel=r.matchId??(ms.find(t=>norm(t.name)===norm(r.name)&&(t.edition||"")===(r.edition||""))?.id||"new");
  return `<div class="rev" data-rev="${r.id}">
  <div class="ph">${r.coverUrl||r.thumbId||r.thumbData?`<img src="${esc(r.coverUrl||(r.thumbId?blobUrl(r.thumbId):r.thumbData))}" alt="Imagen del juego" onerror="this.remove()">`:""}</div>
  <div class="body"><div class="row between"><div class="row"><label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" aria-label="Seleccionar para confirmar en lote" data-sel="${r.id}" ${S.sel?.has(r.id)?"checked":""} ${reviewReady(r)?"":"disabled"}></label><span class="conf" title="Confianza"><i style="width:${Math.round(c*100)}%;background:${col}"></i></span><span class="mono small">${Math.round(c*100)} %</span>${r.origin?`<span class="pill mut">${esc(r.origin)}</span>`:""}</div>${r.note?`<span class="small muted">${esc(r.note)}</span>`:""}</div>
  <div class="form">
   <label class="f" style="grid-column:span 2">Título<input data-rf="name" list="pcNames" value="${esc(r.name)}" placeholder="Escribe el título"></label>
   <label class="f">Consola<select data-rf="platform"><option value="">—</option>${S.settings.platforms.map(p=>`<option value="${p.id}" ${r.platform===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
   <label class="f">Edición<input data-rf="edition" value="${esc(r.edition)}" placeholder="Estándar"></label>
   <label class="f">Región<select data-rf="region">${REGIONS.map(x=>`<option ${r.region===x?"selected":""}>${x}</option>`).join("")}</select></label>
   <label class="f">EAN/UPC<input data-rf="ean" class="mono" value="${esc(r.ean)}" inputmode="numeric"></label>
   <label class="f" style="grid-column:span 2">Coincidencia en tu catálogo<select data-rf="matchId"><option value="new" ${sel==="new"?"selected":""}>Crear título nuevo</option>${ms.map(t=>`<option value="${t.id}" ${sel===t.id?"selected":""}>Añadir copia a: ${esc(t.name)}${t.edition?" · "+esc(t.edition):""}</option>`).join("")}</select></label>
  </div>
  ${!r.name&&r.ean?eanLinks(r.ean):""}
  <div class="row"><button class="btn primary" data-rv="ok">Confirmar</button>${r.photoData||r.photoId||r.thumbData||r.thumbId?`<button class="btn" data-rv="crop">Ajustar recorte</button>`:""}<button class="btn" data-rv="later">Dejar pendiente</button><button class="btn ghost danger" data-rv="no">Rechazar</button></div></div></div>`;
}

    <p class="small muted" style="margin:0">Para ventas reales en España: abre la búsqueda en eBay (vendidos), Wallapop o Vinted, copia el texto o haz capturas, y Claude extrae los precios y descarta los anuncios que no son equivalentes. Tú confirmas antes de guardar.</p>
    <p class="small muted" style="margin:0">Ábrelo desde la pestaña Precios de cualquier juego, o con «Capturar siguiente sin precio».</p></div></div>
  <details class="panel"><summary style="cursor:pointer;font-weight:600">Estado de las fuentes</summary>
   <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Fuente</th><th>Acceso</th><th>Tipo de dato</th><th>En GameVault</th></tr></thead><tbody>
   <tr><td>PriceCharting</td><td style="white-space:normal">API y CSV con suscripción de pago; uso interno</td><td style="white-space:normal">Guía estimada a partir de ventas (USD)</td><td><span class="pill good">Importación CSV</span></td></tr>

  const rows=ts.map(t=>({t,m:market(t.id),n:pricesOf(t.id).length})).sort((a,b)=>(b.m?.value||-1)-(a.m?.value||-1));
  if(!ts.length)return h+`<div class="empty"><p>Cataloga juegos primero; después podrás registrar precios por título.</p></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Título</th><th>Consola</th><th class="num">Estimado</th><th class="num">Rango</th><th>Base</th><th class="num">Var. 90 d</th><th class="num">Obs.</th></tr></thead><tbody>${rows.slice(0,400).map(({t,m,n})=>{const vr=variation(guideSeries(t),90)??salesVariation(t.id,90);return `<tr class="click" data-title="${t.id}" data-tab="precios"><td style="white-space:normal;min-width:180px">${esc(t.name)}</td><td>${platPill(t.platform)}</td><td class="num">${m?eur(m.value):'<span class="muted">Datos insuficientes</span>'}</td><td class="num">${m?.min!=null?eur0(m.min)+"–"+eur0(m.max):"—"}</td><td>${m?`<span class="pill ${m.conf==="alta"?"good":m.conf==="media"?"info":"warn"}" title="${esc(m.basis)}">${m.guide?"guía":esc(m.conf)}</span>`:""}</td><td class="num">${vr==null?'<span class="muted">—</span>':`<span style="color:${vr>=0?"var(--good)":"var(--bad)"}">${vr>=0?"+":""}${vr.toFixed(1)} %</span>`}</td><td class="num">${n}</td></tr>`}).join("")}</tbody></table></div>`;
  if(ps.length)h+=`<h2>Últimas observaciones</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Título</th><th>Fuente</th><th>Tipo</th><th>Estado</th><th class="num">Precio</th><th></th></tr></thead><tbody>${ps.slice(0,50).map(priceRow).join("")}</tbody></table></div>`;
  return h;
}
function priceRow(p){const t=S.titles.get(p.titleId);return `<tr><td>${fdate(p.date)}</td><td style="white-space:normal">${esc(t?.name||"—")}</td><td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.source)}</a>`:esc(p.source)}</td><td><span class="pill ${p.type==="venta"?"good":p.type==="anuncio"?"warn":"mut"}">${esc(PRICE_TYPES[p.type]||p.type)}</span></td><td>${esc(p.cond||"—")}</td><td class="num">${eur(p.price)}</td><td><button class="btn ghost small" data-delprice="${p.id}" aria-label="Borrar observación">✕</button></td></tr>`}

  <div class="kpis"><div class="kpi"><div class="l">Capital invertido</div><div class="v">${eur0(st.invested)}</div><div class="s">en existencias</div></div>
  <div class="kpi"><div class="l">Capital recuperado</div><div class="v">${eur0(st.recovered)}</div><div class="s">ingresos netos de comisiones</div></div>
  <div class="kpi"><div class="l">Beneficio realizado</div><div class="v">${eur0(st.realized)}</div><div class="s">${st.sold.length} ventas cerradas</div></div>
  <div class="kpi"><div class="l">Margen objetivo</div><div class="v">${eur0(S.settings.margin)}</div><div class="s">por copia · <a href="#ajustes">cambiar</a></div></div></div>
  ${S.settings.feesChecked?"":`<div class="banner">Las comisiones de los canales de venta están a 0 €. Introduce las vigentes en <a href="#ajustes">Configuración</a> para que el precio mínimo rentable sea fiable.</div>`}
  <div class="panel" id="calcPanel"><h2>Calculadora rápida</h2><div class="form" style="margin-top:12px">
    <label class="f">Coste de adquisición + gastos<input id="cCost" data-live="1" inputmode="decimal" value="20"></label>
    <label class="f">Precio de venta<input id="cPrice" data-live="1" inputmode="decimal" value="40"></label>
    <label class="f">Canal<select id="cCh" data-live="1">${S.settings.channels.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select></label>
    <label class="f">Margen objetivo<input id="cTarget" data-live="1" inputmode="decimal" value="${S.settings.margin}"></label></div>
    <div id="calcOut" style="margin-top:14px"></div></div>`;
  h+=`<h2>A la venta <span class="mono muted">${forSale.length}</span></h2>`;
  h+=forSale.length?`<div class="tablewrap"><table><thead><tr><th>Juego</th><th>Estado</th><th class="num">Coste</th><th class="num">Mercado</th><th class="num">Mín. rentable</th><th>Recomendación</th></tr></thead><tbody>${forSale.map(c=>{const t=S.titles.get(c.titleId);const m=market(c.titleId);const ch=channel(S.settings.channels[0]?.name);const r=calc({cost:copyCost(c),price:m?.value??null,pct:ch.pct,fixed:ch.fixed,ship:ch.ship,pack:ch.pack});
    const reco=!m?'<span class="muted">Datos insuficientes</span>':r.minP>m.value?'<span class="pill bad">No alcanza el margen al precio actual</span>':`<span class="pill good">Publicar a ${eur0(Math.ceil(m.value))}</span>`;
    return `<tr class="click" data-copy="${c.id}"><td style="white-space:normal">${esc(t?.name||"—")} ${platPill(t?.platform)}</td><td>${statusPill(c.status)}</td><td class="num">${num(c.cost)==null?'<span class="muted">sin coste</span>':eur(copyCost(c))}</td><td class="num">${m?eur(m.value):"—"}</td><td class="num">${eur(r.minP)}</td><td>${reco}</td></tr>`}).join("")}</tbody></table></div><p class="small muted" style="margin:0">Mínimo calculado con las comisiones de ${esc(S.settings.channels[0]?.name||"—")}. Abre una copia para calcular con otro canal.</p>`:`<div class="empty"><p>Marca copias como «Disponible para venta» desde su ficha para verlas aquí con su precio mínimo rentable.</p></div>`;
  h+=`<h2>Ventas cerradas</h2>`;
  h+=st.sold.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Juego</th><th>Canal</th><th class="num">Precio</th><th class="num">Gastos</th><th class="num">Coste</th><th class="num">Beneficio neto</th><th class="num">Rent.</th></tr></thead><tbody>${st.sold.sort((a,b)=>(b.sale?.date||"").localeCompare(a.sale?.date||"")).map(c=>{const t=S.titles.get(c.titleId),s=c.sale||{},n=saleNet(c),g=(num(s.fees)||0)+(num(s.ship)||0)+(num(s.pack)||0)+(num(s.other)||0),cc=copyCost(c);
    return `<tr class="click" data-copy="${c.id}"><td>${fdate(s.date)}</td><td style="white-space:normal">${esc(t?.name||"—")}</td><td>${esc(s.channel||"—")}</td><td class="num">${eur(num(s.price))}</td><td class="num">${eur(g)}</td><td class="num">${eur(cc)}</td><td class="num" style="color:${n>=S.settings.margin?"var(--good)":n>=0?"var(--warn)":"var(--bad)"}">${eur(n)}</td><td class="num">${cc>0?Math.round(n/cc*100)+" %":"—"}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty"><p>Cuando registres una venta desde la ficha de una copia, aparecerá aquí con su beneficio neto.</p></div>`;
  return h;
}
function calcBox(r,price,target){
  const ok=r.net!=null&&r.net>=target;
  return `<div class="grid2"><div class="calc">
   <span class="k">Comisiones</span><span class="v">${eur(r.fees)}</span>
   <span class="k">Beneficio neto</span><span class="v" style="color:${r.net==null?"inherit":ok?"var(--good)":r.net>=0?"var(--warn)":"var(--bad)"}">${eur(r.net)}</span>
   <span class="k">Rentabilidad</span><span class="v">${r.roi==null?"—":r.roi.toFixed(0)+" %"}</span>
   <span class="k tot">Precio mínimo para ${eur0(target)} netos</span><span class="v tot">${eur(r.minP)}</span></div>
   <div class="small">${price==null?"":ok?`<span class="pill good">Cumple el margen objetivo</span>`:`<span class="pill bad">No llega al margen objetivo</span>`}</div></div>`;
}
function bindCalc(){
  const out=$("#calcOut");if(!out)return;
  const go=()=>{const ch=channel($("#cCh").value);const cost=num($("#cCost").value)||0,price=num($("#cPrice").value),target=num($("#cTarget").value)??S.settings.margin;
    out.innerHTML=calcBox(calc({cost,price,pct:ch.pct,fixed:ch.fixed,ship:ch.ship,pack:ch.pack,target}),price,target)};
  ["cCost","cPrice","cCh","cTarget"].forEach(id=>$("#"+id).addEventListener("input",go));go();
}

/* ---------- Ajustes ---------- */

   <div class="row" style="margin-top:8px"><button class="btn primary" data-act="saveKey">Guardar</button>${apiKey()?'<span class="pill good">Clave guardada</span>':'<span class="pill mut">Sin activar (no es necesario)</span>'}</div></div>`:""}
  <div class="panel"><h2>Canales de venta y comisiones</h2><p class="small muted">Introduce las comisiones vigentes de cada plataforma; cambian a menudo, así que GameVault no las presupone. Envío y embalaje son lo que pagas tú por venta.</p>
   <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Canal</th><th class="num">Comisión %</th><th class="num">Fija €</th><th class="num">Envío €</th><th class="num">Embalaje €</th><th></th></tr></thead><tbody>${s.channels.map((c,i)=>`<tr><td><input class="inp" style="width:140px" data-ch="${i}" data-k="name" value="${esc(c.name)}"></td>${["pct","fixed","ship","pack"].map(k=>`<td class="num"><input class="inp mono" style="width:80px;text-align:right" inputmode="decimal" data-ch="${i}" data-k="${k}" value="${c[k]}"></td>`).join("")}<td><button class="btn ghost danger" data-delch="${i}" aria-label="Quitar canal">✕</button></td></tr>`).join("")}</tbody></table></div>
   <div class="row" style="margin-top:10px"><button class="btn" data-act="addCh">Añadir canal</button><button class="btn primary" data-act="saveCh">Guardar comisiones</button></div></div>
  <div class="panel"><h2>Consolas</h2><div class="chips" style="margin-top:8px">${s.platforms.map(p=>`<span class="chip" style="cursor:default">${platPill(p.id)} ${esc(p.name)}</span>`).join("")}</div>
   <div class="form" style="margin-top:12px"><label class="f">Nombre<input id="npName" placeholder="PlayStation 2"></label><label class="f">Abreviatura<input id="npShort" placeholder="PS2"></label><label class="f">Color<input id="npColor" type="color" value="#3d6fd6"></label></div>
   <div class="row" style="margin-top:8px"><button class="btn" data-act="addPlat">Añadir consola</button></div></div>
  <details class="panel plan"><summary>Arquitectura y hoja de ruta</summary>
   <p>Esta versión cubre las fases 1–3, buena parte de la 4 y la 5, y la fase 6 de precios. Funciona como aplicación web en ordenador y móvil y guarda los datos en el almacenamiento privado de esta página en claude.ai, con fotos y portadas como archivos adjuntos. Coste adicional: ninguno.</p>
   <p><b>Modelo de datos.</b> Cuatro colecciones: títulos de catálogo, copias físicas (cada una con su coste, estado y venta), observaciones de precio (histórico que nunca se sobrescribe) y bandeja de revisión. Las copias se vinculan al título, así que añadir otra copia no duplica el título.</p>

   <p><b>Migración a React + Supabase.</b> Cuando la colección y el flujo estén validados, la copia JSON se importa en PostgreSQL. Supabase tiene un plan gratuito con límites de base de datos y almacenamiento; el plan de pago tiene cuota mensual. Conviene comprobar las tarifas vigentes antes de dar el paso. Allí las claves de API de mercado quedarían protegidas en el servidor.</p>
   <p><b>Pendiente.</b></p><ul><li>Fase 6 (hecha en parte): importación de la guía PriceCharting, captura asistida e histórico. Falta la actualización desatendida, que necesita un servidor propio con la clave de API.</li><li>Fase 7: puntuación de oportunidades (0–100), alertas y lista de deseos.</li><li>Fase 8: informes PDF, gráficos de evolución y pruebas.</li></ul></details>`;
}

/* ---------- Ficha de título ---------- */
let sheetState=null;
function openTitle(id,tab="ficha"){sheetState={type:"title",id,tab};drawSheet()}
function closeSheet(){sheetState=null;$("#sheetRoot").innerHTML="";document.body.style.overflow=""}
function drawSheet(){
  if(!sheetState)return;const root=$("#sheetRoot");document.body.style.overflow="hidden";
  if(sheetState.type==="title"){
    const t=sheetState.id?S.titles.get(sheetState.id):null;const isNew=!t;const tt=t||{name:"",platform:"switch",region:"PAL-ES"};
    const tab=isNew?"ficha":sheetState.tab;
    let body="";
    if(tab==="ficha")body=fichaForm(tt,isNew);
    else if(tab==="copias")body=copiesTab(t);
    else body=pricesTab(t);
    root.innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(tt.name||"Nuevo título")}"><header><h2>${isNew?"Nuevo título":esc(tt.name)}</h2><button class="icon-btn" data-sx="close" aria-label="Cerrar">✕</button></header><div class="in">
    ${isNew?"":`<div class="detailhead">${coverHTML(t)}<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="row">${platPill(t.platform)}<span class="small muted">${esc(t.edition||"Edición estándar")} · ${esc(t.region||"—")}</span></div>
      <div class="small muted mono">${t.ean?"EAN "+esc(t.ean):"Sin EAN"}</div>${(()=>{const m=market(t.id);return m?`<div><span class="mono" style="font-size:1.3rem;font-weight:600">${eur(m.value)}</span> <span class="small muted">· ${esc(m.basis)}</span></div>`:`<div class="small muted">Precio: datos insuficientes</div>`})()}
      <div class="row"><span class="btn filebtn">${coverSrc(t)?"Cambiar portada":"Subir portada"}<input type="file" accept="image/*" data-coverin="${t.id}" aria-label="Subir portada"></span>${t.coverId||t.coverData?`<button class="btn" data-sx="recrop">Recortar</button>`:""}${t.ejemplo?'<span class="pill mut">Ejemplo</span>':""}</div></div></div>
     <div class="tabs" role="tablist">${[["ficha","Ficha"],["copias",`Copias (${copiesOf(t.id).length})`],["precios","Precios"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>`}
    ${body}</div></div></div>`;
  }else if(sheetState.type==="copy")drawCopy();
  else if(sheetState.type==="price")drawPrice();
  else if(sheetState.type==="capture")drawCapture();
  else if(sheetState.type==="ref")drawRefSheet();
}
function fichaForm(t,isNew){

   <label class="f" style="grid-column:1/-1">Título oficial<input name="name" required value="${esc(t.name)}"></label>
   <label class="f">Consola<select name="platform">${S.settings.platforms.map(p=>`<option value="${p.id}" ${t.platform===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
   <label class="f">Edición<input name="edition" value="${esc(t.edition)}" placeholder="Estándar"></label>
   <label class="f">Región<select name="region">${REGIONS.map(r=>`<option ${t.region===r?"selected":""}>${r}</option>`).join("")}</select></label>
   <label class="f">EAN/UPC<input name="ean" class="mono" inputmode="numeric" value="${esc(t.ean)}"></label>

}
function copiesTab(t){

function pricesTab(t){

  const gs=guideSeries(t),g=t.guide;
  const vt=d=>{const x=variation(gs,d);return x==null?'<span class="muted">—</span>':`<span style="color:${x>=0?"var(--good)":"var(--bad)"}">${x>=0?"+":""}${x.toFixed(1)} %</span>`};
  const sv=d=>{const x=salesVariation(t.id,d);return x==null?'<span class="muted">—</span>':`<span style="color:${x>=0?"var(--good)":"var(--bad)"}">${x>=0?"+":""}${x.toFixed(1)} %</span>`};
  return `<div class="row between"><span class="small muted">${m?`Estimado ${eur(m.value)} · ${esc(m.basis)}`:"Datos insuficientes: importa la guía de precios o captura ventas completadas."}</span><div class="row"><button class="btn primary" data-sx="capture">Capturar precios (IA)</button><button class="btn" data-sx="addPrice">Registrar a mano</button></div></div>
  ${g?`<div class="panel"><div class="row between"><h3>Guía ${esc(g.src||"PriceCharting")}</h3><span class="small muted">${esc(g.pcName||"")} · ${esc(g.console||"")}</span></div>
   <div class="calc" style="margin-top:8px">${[["Suelto","loose"],["Completo (CIB)","cib"],["Nuevo / precintado","new"]].map(([l,k])=>{const v=g[k];const r=g.cur==="EUR"?1:num(S.settings.usdEur);
     return `<span class="k">${l}</span><span class="v">${v==null?"—":(g.cur==="EUR"?"":"$"+v.toFixed(2)+" · ")+(r?eur(v*r):"—")}</span>`}).join("")}</div>
   ${!num(S.settings.usdEur)&&g.cur!=="EUR"?`<p class="small" style="color:var(--warn);margin:8px 0 0">Indica el cambio USD→EUR en Mercado para convertir estos precios.</p>`:""}
   <p class="small muted" style="margin:8px 0 0">La guía es una estimación de la fuente a partir de ventas, no una venta concreta. Actualizada el ${fdate(g.date)}.</p></div>`:""}
  <div class="panel"><h3>Evolución</h3>${histChart(t)}
   <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th></th><th class="num">30 días</th><th class="num">90 días</th><th class="num">365 días</th></tr></thead><tbody>
   <tr><td>Guía (CIB)</td><td class="num">${vt(30)}</td><td class="num">${vt(90)}</td><td class="num">${vt(365)}</td></tr>

function histChart(t){
  const gs=guideSeries(t),obs=pricesOf(t.id).filter(p=>(p.type==="venta"||p.type==="anuncio")&&p.price!=null&&p.date);
  const pts=[...gs.map(p=>({d:p.d,v:p.v})),...obs.map(p=>({d:p.date,v:p.price}))];
  if(pts.length<2)return `<p class="small muted">Hacen falta al menos dos datos para dibujar la evolución.</p>`;
  const W=640,H=190,L=46,R=12,T=12,B=26;const ts=pts.map(p=>+new Date(p.d)),t0=Math.min(...ts),t1=Math.max(...ts)||t0+1,span=Math.max(t1-t0,864e5);
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){hi+=1;lo=Math.max(0,lo-1)}const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad;
  const x=d=>L+(+new Date(d)-t0)/span*(W-L-R),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks=[0,.5,1].map(f=>lo+(hi-lo)*f);
  let s=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;display:block" role="img" aria-label="Evolución del precio">`;
  s+=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${Math.round(v)} €</text>`).join("");
  s+=`<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${esc(fdate(new Date(t0).toISOString().slice(0,10)))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fdate(new Date(t1).toISOString().slice(0,10)))}</text>`;
  if(gs.length>1){const d=gs.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");s+=`<path d="${d}L${x(gs.at(-1).d)},${H-B}L${x(gs[0].d)},${H-B}Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`}
  if(gs.length)s+=`<circle cx="${x(gs.at(-1).d)}" cy="${y(gs.at(-1).v)}" r="4" fill="var(--accent)"/>`;
  s+=obs.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.price)}" r="3.5" fill="${p.type==="venta"?"var(--good)":"var(--warn)"}" opacity=".9"><title>${esc(PRICE_TYPES[p.type])}: ${p.price} € (${esc(p.date)})</title></circle>`).join("");
  s+=`</svg></div><div class="row small muted" style="gap:14px"><span><i style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:3px"></i> Guía CIB</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good)"></i> Venta completada</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn)"></i> Anuncio</span></div>`;
  return s;
}

}

function wtClean(s){return String(s||"").replace(/<ref[^>]*\/>/gi,"").replace(/<ref[\s\S]*?<\/ref>/gi,"").replace(/\{\{(?:sort|sortname)\|[^|}]*\|([^}]*)\}\}/gi,"$1").replace(/\{\{nowrap\|([^}]*)\}\}/gi,"$1").replace(/\{\{[^}]*\}\}/g,"")
  .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/'''?/g,"").replace(/<br\s*\/?>/gi,", ").replace(/<[^>]+>/g,"").replace(/^[\s|!]*(?:scope="?row"?\s*\|)?/i,"").replace(/^(?:[a-z-]+="[^"]*"\s*)+\|/i,"").replace(/\s+/g," ").trim()}
function parseListWikitext(wt,platform){
  const out=[];const rows=wt.split(/\n\|-[^\n]*/);
  for(const row of rows.slice(1)){
    const lines=row.split("\n").map(l=>l.trim()).filter(l=>l.startsWith("|")||l.startsWith("!"));
    if(!lines.length)continue;
    const cells=[];for(const l of lines){if(l.startsWith("|}"))break;for(const c of l.replace(/^[|!]/,"").split(/\s*(?:\|\||!!)\s*/))cells.push(c)}
    if(!cells.length)continue;
    let first=cells[0].replace(/^\s*(?:[a-z-]+="[^"]*"\s*)+\|/i,"");
    const m=first.match(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/);
    const title=cleanTitleRef(m?wtClean(m[2]||m[1]):wtClean(first));
    if(!title||title.length<2||/^(title|game|total|name)$/i.test(title)||title.length>150)continue;
    out.push({t:title,link:m?m[1].trim():"",genre:wtClean(cells[1]||"").slice(0,60),dev:wtClean(cells[2]||"").slice(0,80),pub:wtClean(cells[3]||"").slice(0,80),pl:platform});
  }
  return out;
}

function cleanTitleRef(t){let s=String(t||"");
  s=s.replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&#39;|&apos;/gi,"'").replace(/&quot;/gi,'"').replace(/&[a-z]+;/gi," ");
  s=s.replace(/\{\{[a-z]+\|/gi,"").replace(/[{}\[\]]/g,"").replace(/\s*\((?:video ?game|videojuego|jeu vidéo|Videospiel|videogioco|videogame)[^)]*\)\s*$/i,"").replace(/\s+/g," ").trim();
  return s}
function junkTitle(t){return !t||t.length<2||/digital only|^(title|game|total|name|n\/a|tba|tbd)$/i.test(t)||/^[\W_]+$/.test(t)}
function sanitizeRef(list){const out=[];for(const r of list){const n=cleanTitleRef(r.n);if(junkTitle(n))continue;r.n=n;if(r.en)r.en=cleanTitleRef(r.en);if(r.es)r.es=cleanTitleRef(r.es);out.push(r)}return out}

function simTitle(a,b){a=norm(cleanTitleRef(a));b=norm(cleanTitleRef(b));if(!a||!b)return false;if(a===b)return true;const s=a.length<b.length?a:b,l=a.length<b.length?b:a;return l.includes(s)&&s.length/l.length>=0.7}
async function huntOne(r){

    try{const j=await wpJ(lang,"action=query&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=330&pilicense=any&titles="+encodeURIComponent(title),20000);
      const pg=Object.values(j.query?.pages||{})[0];if(pg?.thumbnail)r.img=pg.thumbnail.source}catch{}}
  // 2) búsqueda por título en Wikipedia (inglés, español, japonés, francés)
  for(const lang of ["en","es","ja","fr"]){if(r.img)break;const names=[...new Set([r.en,r.es,r.n].filter(Boolean))];
    for(const nm of names){if(r.img)break;
      try{const j=await wpJ(lang,"action=query&generator=search&gsrlimit=3&gsrsearch="+encodeURIComponent(`"${nm}" Switch`)+"&prop=pageimages&piprop=thumbnail&pithumbsize=330&pilicense=any",20000);
        for(const pg of Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0))){if(pg.thumbnail&&simTitle(pg.title,nm)){r.img=pg.thumbnail.source;r.lk={...(r.lk||{}),[lang]:pg.title};break}}}catch{}}}

    if(res.ok){const b=await res.blob();if(b.type.startsWith("image/")){await idbOp("put","refimg/"+r.q,b);r.imgSaved=1}}}catch{}}
}

  if(f.some(x=>PHYS_RE.test(x)))return"fisico";if(f.every(x=>DIG_RE.test(x)))return"digital";return"sinconf"}
async function fetchFormats(force){
  let last=0;try{last=+localStorage.getItem("gv-fmt")||0}catch{}
  if(!force&&Date.now()-last<3*864e5&&REF.list.some(r=>r.fmt))return;
  const byQ=new Map(REF.list.map(r=>[r.q,r]));const P=["wd:Q19610114"];try{P.push("wd:"+await switch2Q())}catch{}
  for(const p of P){try{const rows=await sparqlJ(`SELECT ?item ?l WHERE { ?item wdt:P400 ${p} ; wdt:P437 ?x . ?x rdfs:label ?l FILTER(LANG(?l)="en") }`);
    const acc=new Map();for(const b of rows){const q=qid(b);if(!acc.has(q))acc.set(q,new Set());acc.get(q).add(val(b,"l"))}
    for(const [q,set] of acc){const r=byQ.get(q);if(r)r.fmt=[...set]}}catch{}}
  try{localStorage.setItem("gv-fmt",String(Date.now()))}catch{}await saveRef();
}
