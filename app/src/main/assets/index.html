<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Master Studio AI</title>
<style>
:root{--bg:#14161b;--p:#1d2027;--p2:#262a33;--t:#e8e9ec;--m:#9aa0ab;--a:#5b9dff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--p);border-bottom:1px solid #000;flex-wrap:wrap}
header b{font-size:16px;margin-right:auto}
.steps{display:flex;gap:4px;flex-wrap:wrap}.steps button{background:var(--p2)}.steps button.on,button.on{background:var(--a);color:#fff}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid #3a3f4b;border-radius:6px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--a)}
main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:10px;padding:10px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:var(--p);border-radius:10px;padding:12px;overflow:auto}
.panel h3{margin:4px 0 8px;font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}
label.r{display:grid;grid-template-columns:110px 1fr 38px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
label.r input{padding:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
canvas{background:repeating-conic-gradient(#2a2e37 0 25%,#23262e 0 50%) 0 0/16px 16px;border-radius:8px;image-rendering:pixelated;max-width:100%;touch-action:none}
#dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#dirs figure{margin:0;text-align:center;font-size:11px;color:var(--m);cursor:pointer}
#dirs figure.on canvas{outline:2px solid var(--a)}
#tl{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
#tl canvas{flex:none;cursor:pointer}#tl canvas.on{outline:2px solid var(--a)}
.rep{font-size:12px;line-height:1.5}.ok{color:var(--ok)}.bad{color:var(--bad)}
.lib{display:flex;gap:6px;flex-wrap:wrap}.lib div{background:var(--p2);padding:6px;border-radius:6px;font-size:12px}
.hide{display:none!important}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff}#printArea img{max-width:100%}.pg{page-break-after:always}}
</style></head><body>
<header><b>🎮 Sprite Master Studio AI</b>
<div class="steps" id="steps"></div>
<span id="task" class="hide" style="display:flex;gap:6px;align-items:center;font-size:12px"><span style="width:90px;height:8px;background:#333;border-radius:4px;overflow:hidden"><span id="taskBar" style="display:block;height:100%;width:0;background:var(--a)"></span></span><span id="taskTxt"></span><button id="taskX">Cancelar</button></span><span id="gstat" style="font-size:12px;color:var(--m)"></span><button id="undo">↶</button><button id="redo">↷</button></header>
<main>
<section class="panel" id="side"></section>
<section class="panel" id="stage">
 <div class="row"><select id="animSel"></select>
  <button id="play">▶</button><button id="prev">⏮</button><button id="next">⏭</button>
  <label style="font-size:12px">FPS <input id="fps" type="number" min="1" max="60" value="10" style="width:56px"></label>
  <label style="font-size:12px"><input type="checkbox" id="cmpOn"> Comparar con</label><select id="cmpSel"></select>
 </div>
 <div class="row" style="align-items:flex-start">
  <canvas id="view" width="320" height="320"></canvas>
  <canvas id="cmp" width="320" height="320" class="hide"></canvas>
  <img id="refImg" style="max-height:320px;border-radius:8px" class="hide" alt="referencia">
 </div>
 <div style="font-size:12px;color:var(--m)">Toca y arrastra un punto azul (pelvis, cabeza, manos, pies) para editar el fotograma. La IK mantiene la longitud de los huesos.</div>
 <h3>Línea temporal</h3>
 <div id="tl"></div>
 <div class="row"><button id="fDup">Duplicar</button><button id="fIns">Insertar intermedio</button><button id="fDel">Eliminar</button><button id="fL">◀ Mover</button><button id="fR">Mover ▶</button><button id="fReset">Reiniciar pose</button></div>
 <h3>Ocho direcciones</h3>
 <div id="dirs"></div>
</section>
</main>
<div id="printArea"></div>
<script>
"use strict";
// ================= MÓDULO: DATOS / PLANTILLAS =================
const TEMPLATES={
 "Normal":{height:100,head:1,shoulder:1,hip:1,arm:1,leg:1,limb:1,body:1,mass:.3,stiff:.3},
 "Delgado":{height:100,head:1,shoulder:.9,hip:.85,arm:1,leg:1.03,limb:.75,body:.75,mass:.15,stiff:.2},
 "Muy delgado":{height:102,head:1,shoulder:.8,hip:.75,arm:1.05,leg:1.05,limb:.55,body:.55,mass:.05,stiff:.15},
 "Musculoso":{height:104,head:.92,shoulder:1.35,hip:1.05,arm:1,leg:1,limb:1.5,body:1.3,mass:.6,stiff:.6},
 "Gordo":{height:98,head:1,shoulder:1.15,hip:1.4,arm:.95,leg:.92,limb:1.4,body:1.9,mass:.8,stiff:.4},
 "Muy voluminoso":{height:100,head:.95,shoulder:1.3,hip:1.7,arm:.9,leg:.85,limb:1.8,body:2.5,mass:1,stiff:.5},
 "Alto":{height:125,head:.9,shoulder:1.05,hip:1,arm:1.05,leg:1.1,limb:.95,body:1,mass:.35,stiff:.3},
 "Bajo":{height:80,head:1.1,shoulder:.95,hip:1,arm:.95,leg:.9,limb:1,body:1.05,mass:.3,stiff:.3},
 "Infantil":{height:70,head:1.45,shoulder:.8,hip:.85,arm:.9,leg:.85,limb:.85,body:.9,mass:.15,stiff:.1},
 "Anciano":{height:94,head:1,shoulder:.9,hip:1,arm:1,leg:.95,limb:.85,body:1,mass:.35,stiff:.9,stoop:.25},
 "Deforme":{height:95,head:1.4,shoulder:1.4,hip:.8,arm:1.3,leg:.8,limb:1.2,body:1.2,mass:.5,stiff:.5,stoop:.35},
 "Amorfo":{height:90,head:.6,shoulder:1.6,hip:1.6,arm:.7,leg:.6,limb:2,body:3,mass:.9,stiff:.2,wobble:1},
 "Monstruo":{height:130,head:1.1,shoulder:1.7,hip:1.2,arm:1.3,leg:.95,limb:1.9,body:1.8,mass:.9,stiff:.6,stoop:.2},
 "Criatura fantástica":{height:110,head:1.2,shoulder:1.1,hip:.9,arm:1.2,leg:1.1,limb:.8,body:.9,mass:.2,stiff:.2,tail:1},
 "Robot":{height:110,head:.9,shoulder:1.3,hip:1.1,arm:1,leg:1,limb:1.3,body:1.3,mass:.7,stiff:1,robot:1},
 "Humanoide":{height:105,head:1.15,shoulder:1,hip:.9,arm:1.15,leg:1.05,limb:.9,body:.9,mass:.3,stiff:.3},
 "Animal bípedo":{height:95,head:1.2,shoulder:1,hip:1.1,arm:.85,leg:.9,limb:1.1,body:1.2,mass:.4,stiff:.3,tail:1,snout:1},
 "Extremidades extra":{height:105,head:1,shoulder:1.1,hip:1,arm:1,leg:1,limb:1,body:1.1,mass:.4,stiff:.3,extraArms:1}
};
const PARAM_UI=[["height","Altura",50,160,1],["head","Tamaño cabeza",.5,2,.01],["shoulder","Anchura hombros",.5,2,.01],["hip","Anchura cadera",.5,2,.01],["arm","Long. brazos",.6,1.5,.01],["leg","Long. piernas",.5,1.5,.01],["limb","Grosor extrem.",.4,2.2,.01],["body","Volumen cuerpo",.4,3,.01],["mass","Masa (física)",0,1,.01],["stiff","Rigidez",0,1,.01],["stoop","Encorvamiento",0,.5,.01]];
const DIRS=["Norte","Noreste","Este","Sureste","Sur","Suroeste","Oeste","Noroeste"];
const DIR_EN=["N","NE","E","SE","S","SW","W","NW"];
const DIR_YAW=[180,135,90,45,0,-45,-90,-135]; // giro del personaje respecto a cámara (0 = mira al espectador)
const ANIMS={ // nombre: [categoría, frames, loop]
 "Reposo (respiración)":["Estáticas",8,1],"Mirar alrededor":["Estáticas",12,1],"Sentado":["Estáticas",4,1],"Sentado en el suelo":["Estáticas",4,1],"Agachado":["Estáticas",4,1],"Guardia de combate":["Estáticas",8,1],"Sujetar objeto":["Estáticas",4,1],"Descanso":["Estáticas",8,1],"Parpadeo":["Estáticas",6,1],"Pose A (rig)":["Estáticas",2,1],
 "Andar":["Desplazamiento",8,1],"Caminar lento":["Desplazamiento",10,1],"Correr":["Desplazamiento",8,1],"Correr rápido":["Desplazamiento",6,1],"Retroceder":["Desplazamiento",8,1],"Lateral":["Desplazamiento",8,1],"Girar":["Desplazamiento",8,0],
 "Puñetazo":["Combate",6,0],"Golpe a dos manos":["Combate",7,0],"Combo de puños":["Combate",10,0],"Patada":["Combate",7,0],"Recibir golpe":["Combate",5,0],"Caer al suelo":["Combate",8,0],"Levantarse":["Combate",8,0],"Defenderse":["Combate",4,1],"Esquivar":["Combate",6,0],
 "Apuntar":["Armas",4,1],"Disparar":["Armas",4,0],"Recargar":["Armas",10,0],"Golpe con arma":["Armas",7,0],"Cambiar de arma":["Armas",8,0],"Guardar arma":["Armas",6,0],"Tensar arco":["Armas",8,0],
 "Preparar salto":["Salto",4,0],"Salto vertical":["Salto",14,0],"Salto adelante":["Salto",14,0],"Salto atrás":["Salto",14,0],"Salto con golpe":["Salto",14,0],"Salto disparando":["Salto",14,0],"Aterrizaje":["Salto",5,0],
 "Celebración":["Adicionales",10,1],"Asentir":["Adicionales",8,1],"Muerte":["Adicionales",10,0]
};
const WEAPONS=["Ninguna","Pistola","Fusil","Espada","Cuchillo","Arco","Maza","Rifle futurista"];
const STYLES=["Ilustración","Pixel art","2.5D sombreado"];
const EXPR=["Neutral","Feliz","Enfadado","Sorprendido","Triste"];
const JOINTS=["pelvis","spine","chest","neck","head","shL","elL","haL","shR","elR","haR","hiL","knL","ftL","hiR","knR","ftR"];
const EDITABLE=["pelvis","head","haL","haR","ftL","ftR"];

// ================= MÓDULO: ESTADO + DESHACER =================
let S=defaultState(),hist=[],fut=[];
function defaultState(){return{name:"Personaje 1",template:"Normal",p:{...TEMPLATES.Normal,stoop:0},
 colors:{skin:"#e8b48a",hair:"#3b2a20",shirt:"#3f6fd6",pants:"#2e3440",shoes:"#1c1c1c",acc:"#d4a640",eyes:"#222222"},
 weapon:"Ninguna",style:"Ilustración",expr:"Neutral",shadow:1,size:128,pixel:48,mode:"2D",
 frames:{},ref:null,approved:{}}}
function framesOf(a){if(!S.frames[a]){const n=ANIMS[a][1];S.frames[a]=Array.from({length:n},(_,i)=>({t:i/n,off:{}}))}return S.frames[a]}
function commit(){typeof autosave=="function"&&autosave();hist.push(JSON.stringify(S));if(hist.length>80)hist.shift();fut=[]}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());refreshAll()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());refreshAll()}

// ================= MÓDULO: MATEMÁTICA 3D =================
const V=(x,y,z)=>[x,y,z],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>{const l=len(a)||1;return mul(a,1/l)};
const rotY=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return[p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]};
const rotX=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return[p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]};
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const env=(t,a,b)=>clamp((t-a)/(b-a),0,1); // rampa
const bump=(t,a,m,b)=>t<m?ease(env(t,a,m)):1-ease(env(t,m,b));
// IK de dos huesos con vector polo; respeta longitudes exactas
function ik(root,target,l1,l2,pole){let d=sub(target,root),dist=len(d);const max=l1+l2-1e-3,min=Math.abs(l1-l2)+1e-3;
 dist=clamp(dist,min,max);const dn=nrm(d);const end=add(root,mul(dn,dist));
 const a=Math.acos(clamp((l1*l1+dist*dist-l2*l2)/(2*l1*dist),-1,1));
 let pp=sub(pole,mul(dn,dot(pole,dn)));if(len(pp)<1e-4)pp=[0,0,1];pp=nrm(pp);
 const mid=add(root,add(mul(dn,Math.cos(a)*l1),mul(pp,Math.sin(a)*l1)));return[mid,end]}

// ================= MÓDULO: ESQUELETO =================
function rig(p){const H=p.height;return{H,headR:H*.065*p.head,torso:H*.29,neck:H*.05,thigh:H*.245*p.leg,shin:H*.235*p.leg,upper:H*.165*p.arm,fore:H*.155*p.arm,
 shW:H*.11*p.shoulder,hipW:H*.07*p.hip,limbW:H*.045*p.limb,bodyW:H*.1*p.body,foot:H*.06}}

// ================= MÓDULO: MOTOR DE ANIMACIÓN (procedural, físico) =================
// Devuelve parámetros de control; luego solveBody aplica IK, contacto con suelo y equilibrio.
function control(anim,t,p,R){
 const m=p.mass,st=p.stiff,legL=R.thigh+R.shin,hipH=legL*.97;
 const c={root:[0,0,0],lean:(p.stoop||0)*.6,twist:0,side:0,crouch:0,ftL:[-R.hipW,0,0],ftR:[R.hipW,0,0],haL:null,haR:null,head:[0,0,0],yaw:0,lay:0,arms:"rest",blink:0,mouth:0};
 const T=2*Math.PI*t,br=Math.sin(T)*(1+m)*.6;
 const gait=(speed,stride,lift,bob,lean,dirZ=1,lat=0)=>{
  stride*=legL*(1-m*.3)*(1-st*.15);lift*=legL*(1-m*.4);
  const leg=(ph,sx)=>{const s=ph%1;let z,y;
   if(s<.5){z=lerp(stride/2,-stride/2,s/.5);y=0}else{const u=(s-.5)/.5;z=lerp(-stride/2,stride/2,ease(u));y=Math.sin(u*Math.PI)*lift}
   return[sx+lat*z/(stride||1)*legL*.3*(lat?1:0),y,z*dirZ*(lat?0:1)].map((v,i)=>i==0&&lat?sx+z*lat*.8:v)};
  c.ftL=leg(t,-R.hipW*(1+m*.5));c.ftR=leg(t+.5,R.hipW*(1+m*.5));
  c.root[1]=-Math.abs(Math.cos(T))*bob*legL*(1+m)+bob*legL*.5;
  c.side=Math.sin(T)*R.hipW*(.25+m*1.2);c.lean+=lean*dirZ;c.twist=Math.sin(T)*.18*(1-st*.5)*(lat?0:1);
  c.swing=Math.sin(T)*speed*(1-st*.4);c.arms="swing"};
 switch(anim){
 case"Reposo (respiración)":c.root[1]=br*.6;c.chestBreath=br;break;
 case"Descanso":c.root[1]=br*.4;c.side=R.hipW*.5;c.ftR=[R.hipW*1.6,0,.1*legL];c.lean+=.05;c.head=[0,-.15,0];break;
 case"Pose A (rig)":c.arms="apose";c.ftL=[-R.hipW*1.9,0,0];c.ftR=[R.hipW*1.9,0,0];break;
 case"Parpadeo":c.blink=t>.6&&t<.8?1:0;c.root[1]=br*.3;break;
 case"Mirar alrededor":c.yaw=Math.sin(T)*.9;c.head=[0,0,0];break;
 case"Asentir":c.head=[0,Math.sin(T*2)*.25,0];break;
 case"Sentado":c.sit=1;c.crouch=R.thigh*.95;c.ftL=[-R.hipW,0,R.thigh*.95];c.ftR=[R.hipW,0,R.thigh*.95];c.root[1]=br*.3;c.root[2]=-R.thigh*.05;break;
 case"Sentado en el suelo":c.crouch=hipH-R.H*.02;c.ftL=[-R.hipW*2,0,legL*.85];c.ftR=[R.hipW*2,0,legL*.85];c.lean+=-.1;c.arms="back";break;
 case"Agachado":c.crouch=legL*.45;c.lean+=.45;c.ftL=[-R.hipW*1.3,0,.08*legL];c.ftR=[R.hipW*1.3,0,-.05*legL];c.root[1]=br*.3;c.arms="guard";break;
 case"Guardia de combate":c.crouch=legL*.12;c.ftL=[-R.hipW*1.4,0,.25*legL];c.ftR=[R.hipW*1.4,0,-.2*legL];c.root[1]=br*.5;c.arms="guard";c.twist=-.2;break;
 case"Defenderse":c.crouch=legL*.15;c.ftL=[-R.hipW*1.4,0,.2*legL];c.ftR=[R.hipW*1.4,0,-.2*legL];c.arms="block";c.lean+=.1;break;
 case"Sujetar objeto":c.arms="hold";c.root[1]=br*.4;break;
 case"Andar":gait(1,.55,.18,.03,.05);break;
 case"Caminar lento":gait(.6,.38,.1,.015,.02);break;
 case"Correr":gait(1.6,1.1,.45,.07,.25);c.arms="run";break;
 case"Correr rápido":gait(2,1.45,.6,.09,.38);c.arms="run";break;
 case"Retroceder":gait(.8,.45,.15,.025,-.06,-1);break;
 case"Lateral":gait(.5,.5,.15,.02,0,1,1);c.arms="guard";break;
 case"Girar":c.yaw=t*Math.PI*2;gait(.5,.2,.12,.02,0);break;
 case"Puñetazo":{const k=bump(t,0,.35,1);c.arms="guard";c.punchR=k;c.twist=-.2+.6*k;c.lean+=.1*k;c.crouch=legL*.1;c.ftL=[-R.hipW*1.4,0,.25*legL];c.ftR=[R.hipW*1.4,0,-.2*legL];break}
 case"Combo de puños":{const k1=bump(t,0,.2,.45),k2=bump(t,.35,.55,.8),k3=bump(t,.65,.85,1);c.arms="guard";c.punchR=Math.max(k1,k3);c.punchL=k2;c.twist=-.2+.6*(k1+k3)-.6*k2;c.crouch=legL*.1;c.ftL=[-R.hipW*1.4,0,.25*legL];c.ftR=[R.hipW*1.4,0,-.2*legL];c.uppercut=k3;break}
 case"Golpe a dos manos":{const up=bump(t,0,.4,.55),dn=env(t,.45,.65)*(1-env(t,.8,1));c.arms="double";c.dbl=up-dn*1.2;c.lean+=-.15*up+.4*dn;c.crouch=legL*.2*dn;break}
 case"Patada":{const k=bump(t,.1,.45,.9);c.arms="guard";c.lean+=-.25*k;c.ftR=[R.hipW,k*legL*.75,k*legL*.85];c.twist=.2*k;break}
 case"Recibir golpe":{const k=bump(t,0,.2,1);c.lean+=-.5*k;c.root[2]=-k*R.H*.08;c.head=[0,.4*k,0];c.arms="flail";break}
 case"Caer al suelo":{const k=ease(env(t,0,.8));c.lay=k;c.lean+=-1.5*k;c.crouch=k*hipH*.82;c.root[2]=-k*R.H*.3;c.arms="flail";c.ftL=[-R.hipW,0,k*legL*.6];c.ftR=[R.hipW,0,k*legL*.7];c.bounce=Math.sin(env(t,.8,1)*Math.PI)*R.H*.03;break}
 case"Levantarse":{const k=1-ease(t);c.lean+=-1.5*k+.3*bump(t,.3,.6,1);c.crouch=k*hipH*.82;c.ftL=[-R.hipW,0,k*legL*.5];c.ftR=[R.hipW,0,k*legL*.2];c.arms=k>.3?"push":"rest";break}
 case"Esquivar":{const k=bump(t,0,.35,1);c.root[0]=-k*R.H*.25;c.side=0;c.lean+=.2*k;c.tilt=-.4*k;c.crouch=legL*.25*k;c.ftL=[-R.hipW-k*R.H*.3,0,0];c.arms="guard";break}
 case"Apuntar":c.arms="aim";c.root[1]=br*.3;c.ftL=[-R.hipW*1.3,0,.15*legL];c.ftR=[R.hipW*1.3,0,-.15*legL];break;
 case"Disparar":c.arms="aim";c.recoil=bump(t,0,.15,.6);c.fire=t<.25;c.ftL=[-R.hipW*1.3,0,.15*legL];c.ftR=[R.hipW*1.3,0,-.15*legL];c.lean+=-.06*c.recoil;break;
 case"Recargar":c.arms="reload";c.rl=t;c.head=[0,.25,0];break;
 case"Golpe con arma":{const up=bump(t,0,.35,.5),sw=env(t,.4,.65);c.arms="slash";c.sl=up-sw*2+env(t,.75,1)*.8;c.twist=-.4*up+.6*sw*(1-env(t,.75,1));c.lean+=.2*sw*(1-env(t,.75,1));c.ftL=[-R.hipW*1.3,0,.3*legL*sw];break}
 case"Cambiar de arma":c.arms="holster";c.hs=Math.sin(t*Math.PI);c.swap=t>.5;break;
 case"Guardar arma":c.arms="holster";c.hs=ease(t);c.hideW=t>.85;break;
 case"Tensar arco":c.arms="bow";c.draw=bump(t,0,.6,1);c.twist=-.5;c.ftL=[-R.hipW*1.4,0,.2*legL];c.ftR=[R.hipW*1.4,0,-.2*legL];break;
 case"Preparar salto":c.crouch=legL*.35*ease(t);c.lean+=.3*ease(t);c.arms="back";break;
 case"Salto vertical":case"Salto adelante":case"Salto atrás":case"Salto con golpe":case"Salto disparando":{

  for(let i=0;i<w*h;i++)px[i]=d[i*4+3]<128?255:Math.round(d[i*4]/51)*36+Math.round(d[i*4+1]/51)*6+Math.round(d[i*4+2]/51);

  B(8);const lz=lzw(px,8);for(let i=0;i<lz.length;i+=255){const ch=lz.slice(i,i+255);B(ch.length,...ch)}B(0)}

function lzw(px,mcs){const clear=1<<mcs,eoi=clear+1,out=[];let cur=0,bits=0,size=mcs+1,dict=new Map(),next=eoi+1;

async function verify(blob,kind,extra){const u=new Uint8Array(await blob.arrayBuffer()),ok=(c,m)=>{if(!c)throw new Error("Verificación fallida ("+kind+"): "+m)};

 if(kind=="gif")ok(str(0,6)=="GIF89a"&&u[u.length-1]==0x3B,"cabecera/cierre GIF");
 if(kind=="pdf")ok(str(0,5)=="%PDF-"&&str(u.length-5,5)=="%%EOF","estructura PDF");
 if(kind=="glb")ok(new DataView(u.buffer).getUint32(0,true)==0x46546C67&&new DataView(u.buffer).getUint32(8,true)==u.length,"cabecera GLB");

  for(let i=0;i<n;i++){ok(dv.getUint32(p,true)==0x02014b50,"directorio");const crc=dv.getUint32(p+16,true),sz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),lo=dv.getUint32(p+42,true),lnl=dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
   ok(crc32(u.subarray(lo+30+lnl,lo+30+lnl+sz))==crc,"CRC entrada "+i);p+=46+nl}if(extra)ok(n==extra,"nº de archivos "+n+"≠"+extra)}

 $("o3").onclick=()=>{if(!need())return;download(makeZip([{name:slug(S.name)+".obj",data:obj3D(M3.mesh)},{name:slug(S.name)+".mtl",data:"newmtl tex\nmap_Kd "+slug(S.name)+"_tex.png\n"},{name:slug(S.name)+"_tex.png",data:Uint8Array.from(atob(M3.mesh.tex.toDataURL().split(",")[1]),c=>c.charCodeAt(0))}]),slug(S.name)+"_obj.zip")};
 $("s3").onclick=()=>need()&&sheet3D(cur.anim,S.size).toBlob(b=>download(b,slug(S.name)+"_"+slug(cur.anim)+"_3d_sheet.png"));
 $("t3").onclick=()=>need()&&M3.mesh.tex.toBlob(b=>download(b,slug(S.name)+"_textura.png"))},
8:()=>{$("save").onclick=()=>{const l=store.get();l[S.name]=S;if(store.set(l))step(8)};$("new").onclick=()=>{commit();S=defaultState();refreshAll();step(1)};
 $("imp").onchange=e=>{const f=e.target.files[0];f&&f.text().then(t=>{const n=JSON.parse(t);if(!n||!n.p||!n.colors)throw new Error("no es un proyecto válido");commit();S=n;refreshAll();status("Proyecto abierto")}).catch(er=>logErr("Abrir proyecto: "+er.message))};
 $("libList").onclick=e=>{const l=store.get();if(e.target.dataset.o){commit();S=l[e.target.dataset.o];refreshAll()}if(e.target.dataset.d){delete l[e.target.dataset.d];store.set(l);step(8)}};document.querySelectorAll("[data-bk]").forEach(b=>b.onclick=()=>{try{const bk=JSON.parse(localStorage.getItem("smsai_bk"));commit();S=JSON.parse(bk[+b.dataset.bk].s);refreshAll();status("Copia restaurada")}catch(e){logErr("No se pudo restaurar: "+e.message)}})}
};
function setFrames(a,n){n=clamp(n|0,2,48);const old=framesOf(a);S.frames[a]=Array.from({length:n},(_,i)=>{const t=i/n,j=Math.round(t*old.length)%old.length;return{t,off:Math.abs(old[j].t-t)<.02?old[j].off:{}}});if(a==cur.anim){cur.frame=0;buildTimeline()}}
function fillAnimSel(){$("animSel").innerHTML=opt(Object.keys(ANIMS),cur.anim);$("cmpSel").innerHTML=opt(Object.keys(ANIMS),"Correr")}
function setAnim(a){cur.anim=a;cur.frame=0;$("animSel").value=a;buildTimeline();refreshView()}
$("animSel").onchange=e=>setAnim(e.target.value);
// visor principal + edición por arrastre
const view=$("view"),vctx=view.getContext("2d");let lastR=null,drag=null;
function drawMain(){if(S.style=="Pixel art"){vctx.clearRect(0,0,320,320);vctx.imageSmoothingEnabled=false;vctx.drawImage(renderFrame(cur.anim,cur.frame,cur.dir,S.pixel),0,0,320,320);
  lastR=render(document.createElement("canvas").getContext("2d"),cur.anim,cur.frame,cur.dir,320,320);if(cur.step==6)EDITABLE.forEach(k=>{const q=lastR.J[k];vctx.fillStyle=k==cur.sel?"#fc3":"#5b9dff";vctx.beginPath();vctx.arc(q.x,q.y,6,0,7);vctx.fill()})}
 else lastR=render(vctx,cur.anim,cur.frame,cur.dir,320,320,{handles:cur.step==6,sel:cur.sel});
 if($("cmpOn").checked){$("cmp").classList.remove("hide");const ca=$("cmpSel").value,n=framesOf(ca).length;render($("cmp").getContext("2d"),ca,Math.floor(cur.frame*n/framesOf(cur.anim).length)%n,cur.dir,320,320)}else $("cmp").classList.add("hide")}
const ptr=e=>{const r=view.getBoundingClientRect();return[(e.clientX-r.left)*320/r.width,(e.clientY-r.top)*320/r.height]};
view.onpointerdown=e=>{if(cur.step!=6)step(6);const[x,y]=ptr(e);let best=null,bd=18;EDITABLE.forEach(k=>{const q=lastR.J[k],d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=k}});
 if(best){commit();cur.sel=best;cur.playing=false;drag={k:best,x,y};view.setPointerCapture(e.pointerId)}drawMain()};
view.onpointermove=e=>{if(!drag)return;const[x,y]=ptr(e),dx=(x-drag.x)/lastR.sc,dy=-(y-drag.y)/lastR.sc;drag.x=x;drag.y=y;
 const w=rotY([dx,0,0],-lastR.yaw);const f=framesOf(cur.anim)[cur.frame];const o=f.off[drag.k]||[0,0,0];f.off[drag.k]=[o[0]+w[0],o[1]+dy,o[2]+w[2]];refreshView()};
view.onpointerup=()=>{drag=null;buildTimeline()};
// línea temporal
function buildTimeline(){const tl=$("tl"),fr=framesOf(cur.anim);tl.innerHTML="";fr.forEach((_,i)=>{const c=renderFrame(cur.anim,i,cur.dir,64);if(i==cur.frame)c.classList.add("on");c.onclick=()=>{cur.frame=i;cur.playing=false;$("play").textContent="▶";refreshView()};tl.appendChild(c)})}
function tlMark(){[...$("tl").children].forEach((c,i)=>c.classList.toggle("on",i==cur.frame))}
const F=()=>framesOf(cur.anim);
$("fDup").onclick=()=>{commit();const f=F()[cur.frame];F().splice(cur.frame+1,0,JSON.parse(JSON.stringify(f)));cur.frame++;buildTimeline();refreshView()};
$("fIns").onclick=()=>{commit();const fr=F(),a=fr[cur.frame],b=fr[(cur.frame+1)%fr.length];let t=(a.t+(b.t>a.t?b.t:b.t+1))/2%1;const off={};new Set([...Object.keys(a.off),...Object.keys(b.off)]).forEach(k=>off[k]=lerp3(a.off[k]||[0,0,0],b.off[k]||[0,0,0],.5));fr.splice(cur.frame+1,0,{t,off});cur.frame++;buildTimeline();refreshView()};
$("fDel").onclick=()=>{if(F().length<=2)return;commit();F().splice(cur.frame,1);cur.frame=Math.min(cur.frame,F().length-1);buildTimeline();refreshView()};
const mv=d=>{const fr=F(),j=cur.frame+d;if(j<0||j>=fr.length)return;commit();[fr[cur.frame],fr[j]]=[fr[j],fr[cur.frame]];cur.frame=j;buildTimeline();refreshView()};
$("fL").onclick=()=>mv(-1);$("fR").onclick=()=>mv(1);$("fReset").onclick=()=>{commit();F()[cur.frame].off={};buildTimeline();refreshView()};
$("play").onclick=()=>{cur.playing=!cur.playing;$("play").textContent=cur.playing?"⏸":"▶"};
$("prev").onclick=()=>{cur.playing=false;cur.frame=(cur.frame-1+F().length)%F().length;refreshView()};
$("next").onclick=()=>{cur.playing=false;cur.frame=(cur.frame+1)%F().length;refreshView()};
$("cmpOn").onchange=refreshView;$("cmpSel").onchange=refreshView;
$("undo").onclick=undo;$("taskX").onclick=()=>{if(TASK)TASK.cancel=true};$("redo").onclick=redo;
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key=="z"){e.preventDefault();undo()}if(e.ctrlKey&&e.key=="y"){e.preventDefault();redo()}});
// cuadrícula de 8 direcciones
const dirsEl=$("dirs");const dirC=DIRS.map((d,i)=>{const f=document.createElement("figure");const c=document.createElement("canvas");c.width=c.height=110;f.appendChild(c);f.insertAdjacentHTML("beforeend",`<figcaption>${DIR_EN[i]} · ${d}</figcaption>`);f.onclick=()=>{cur.dir=i;buildTimeline();refreshView()};dirsEl.appendChild(f);return{f,c}});
function refreshView(){drawMain();dirC.forEach(({f,c},i)=>{f.classList.toggle("on",i==cur.dir);const x=c.getContext("2d");x.clearRect(0,0,110,110);x.imageSmoothingEnabled=false;x.drawImage(renderFrame(cur.anim,cur.frame%F().length,i,S.style=="Pixel art"?S.pixel:110),0,0,110,110)});tlMark()}
function refreshAll(){if(S.cut&&S.cut.on&&(!CUT||CUT.ver!==S.cut.ver)){buildCut(false).then(()=>refreshView()).catch(()=>{})}cur.frame=Math.min(cur.frame,F().length-1);if(S.ref){$("refImg").src=S.ref;$("refImg").classList.remove("hide")}fillAnimSel();buildTimeline();refreshView();step(cur.step)}
let acc=0,lt=performance.now();function loop(now){acc+=now-lt;lt=now;if(cur.playing&&acc>1000/fps()&&!drag){acc=0;cur.frame=(cur.frame+1)%F().length;drawMain();if(cur.step!=6||true){dirC.forEach(({c},i)=>{const x=c.getContext("2d");x.clearRect(0,0,110,110);x.imageSmoothingEnabled=false;x.drawImage(renderFrame(cur.anim,cur.frame,i,S.style=="Pixel art"?S.pixel:110),0,0,110,110)})}tlMark()}if(cur.step==9&&M3.mesh)draw3(cur.anim,cur.frame%F().length,null);requestAnimationFrame(loop)}
$("play").textContent="⏸";fillAnimSel();buildTimeline();refreshView();step(1);requestAnimationFrame(loop);
try{const a=localStorage.getItem("smsai_auto");if(a){const b=document.createElement("div");b.style.cssText="position:fixed;bottom:10px;left:10px;right:10px;background:#263;padding:10px;border-radius:8px;z-index:9";b.innerHTML="Hay un proyecto guardado automáticamente. <button id=rcY>Recuperar</button> <button id=rcN>Descartar</button>";document.body.appendChild(b);$("rcY").onclick=()=>{S=JSON.parse(a);refreshAll();b.remove();status("Proyecto recuperado")};$("rcN").onclick=()=>b.remove()}}catch(e){}
</script></body></html>
