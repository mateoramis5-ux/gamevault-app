name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[apk]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleRelease --no-daemon
      - run: mkdir -p dist && cp app/build/outputs/apk/release/*.apk dist/SpriteMasterStudio.apk
      - uses: actions/upload-artifact@v4
        with: { name: SpriteMasterStudio-apk, path: dist/SpriteMasterStudio.apk }
      - name: Publicar descarga directa (Release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete sprite-master-latest -y --cleanup-tag || true
          gh release create sprite-master-latest dist/SpriteMasterStudio.apk --target "${{ github.sha }}" --title "Sprite Master Studio AI (APK)" --notes "Descarga SpriteMasterStudio.apk e instálalo en tu tablet."
      - name: Guardar APK en la rama
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f dist/SpriteMasterStudio.apk && git commit -m "APK compilado [apk]" && git push
